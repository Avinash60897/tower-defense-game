<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Verdant Siege — Campaign</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #1d3223 0%, #0a120c 55%, #040705 100%);
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e8f0e2; user-select: none;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  #wrap {
    position: relative; width: min(100vw, 156.25vh); aspect-ratio: 1000 / 640;
    max-height: 100vh; border-radius: 12px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 0 0 2px rgba(120,190,130,0.18), 0 0 90px rgba(70,200,120,0.09);
  }
  canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }

  .hidden { display: none !important; }

  /* HUD */
  #hud {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 13px;
    background: linear-gradient(180deg, rgba(28,44,32,0.94), rgba(11,19,13,0.97));
    border: 1px solid rgba(140,205,145,0.26);
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    backdrop-filter: blur(7px); font-size: 13px; z-index: 6;
  }
  .stat {
    display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.06); font-weight: 700; min-width: 60px; justify-content: center;
  }
  .ico.heart { color: #ff5f6d; } .ico.coin { color: #ffd257; } .ico.wave { color: #9fe0ff; }
  #lives.flash { animation: pop 0.35s ease; }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.45); color:#ff8a8a;} 100%{transform:scale(1);} }

  #backBtn {
    font-family: inherit; font-weight: 800; font-size: 11px; letter-spacing: 1px;
    padding: 7px 12px; border-radius: 9px; border: 1px solid rgba(200,200,200,0.35);
    color: #e0e8e0; background: linear-gradient(180deg, #555, #333);
    box-shadow: 0 3px 0 #222; cursor: pointer;
  }
  #backBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #222; }
  #startWaveBtn {
    font-family: inherit; font-weight: 900; font-size: 11px; letter-spacing: 0.7px;
    padding: 7px 11px; border-radius: 9px; border: 1px solid rgba(180,240,180,0.6);
    color: #06210c; background: linear-gradient(180deg, #b6ffc0, #63d97a 55%, #33a94c);
    box-shadow: 0 3px 0 #1e6b31; cursor: pointer;
  }
  #startWaveBtn:disabled { cursor: default; opacity: 0.58; filter: saturate(0.45); }
  #startWaveBtn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #1e6b31; }
  #shopBtn {
    font-family: inherit; font-weight: 900; font-size: 11px; letter-spacing: 0.7px;
    padding: 7px 11px; border-radius: 9px; border: 1px solid rgba(255,220,130,0.55);
    color: #2a1e05; background: linear-gradient(180deg, #ffe09a, #f0ad42 55%, #ce7414);
    box-shadow: 0 3px 0 #8a5508; cursor: pointer;
  }
  #shopBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a5508; }

  /* Tower shop */
  #buildBar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 390px;
    background: linear-gradient(180deg, rgba(10,18,12,0.94), rgba(8,14,10,0.99));
    border-top: 1px solid rgba(140,205,145,0.35);
    padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 6;
  }
  .shopHeading { display: flex; align-items: center; justify-content: space-between; }
  .shopTitle { font-size: 20px; font-weight: 900; color: #ffe0a0; letter-spacing: 1.5px; }
  .shopSubtitle { font-size: 10px; color: #a8c8a8; letter-spacing: 0.6px; }
  #shopHome { display: flex; align-items: center; justify-content: center; flex: 1; }
  #buyTowersBtn {
    width: min(520px, 92%); min-height: 155px; border-radius: 16px; cursor: pointer;
    border: 2px solid rgba(255,220,130,0.62); color: #fff3ce; font-family: inherit;
    background: linear-gradient(135deg, rgba(82,124,74,0.98), rgba(23,51,30,0.99));
    box-shadow: 0 10px 28px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.16);
  }
  #buyTowersBtn strong { display: block; font-size: 28px; letter-spacing: 2px; }
  #buyTowersBtn span { display: block; margin-top: 9px; font-size: 12px; color: #d4e8ce; letter-spacing: 1px; }
  #buyTowersBtn:hover { filter: brightness(1.12); transform: translateY(-2px); }
  #towerBrowser { display: flex; flex-direction: column; gap: 9px; flex: 1; min-height: 0; }
  #towerBrowser.hidden, #shopHome.hidden { display: none; }
  #towerBrowserTop { display: flex; align-items: center; gap: 12px; }
  #towerBackBtn { font-family: inherit; font-weight: 900; font-size: 11px; padding: 7px 11px; border-radius: 7px; cursor: pointer; color: #e8f0e2; background: #354338; border: 1px solid rgba(180,240,180,0.38); }
  #tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .tab {
    font-size: 11px; padding: 6px 13px; border-radius: 7px;
    border: 1px solid rgba(140,205,145,0.22); background: rgba(30,45,35,0.8);
    color: #a8c8a8; cursor: pointer; font-family: inherit; font-weight: 700; letter-spacing: 0.5px;
  }
  .tab.active {
    background: linear-gradient(180deg, #4a7a52, #2a5232); color: #e8f5e0;
    border-color: rgba(180,240,180,0.6);
  }
  #towerStrip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; overflow-y: auto;
    padding: 4px; align-content: start; flex: 1;

  }
  #towerStrip::-webkit-scrollbar { width: 6px; }
  #towerStrip::-webkit-scrollbar-thumb { background: rgba(140,205,145,0.3); border-radius: 2px; }
  .tcard {
    min-height: 185px; padding: 9px;
    border-radius: 12px; background: linear-gradient(180deg, rgba(42,68,48,0.98), rgba(13,21,15,0.98));
    border: 1px solid rgba(140,205,145,0.34); cursor: pointer; text-align: center;
    transition: transform 0.1s;
  }
  .tcard.selected { border-color: #7ee08a; box-shadow: 0 0 0 2px rgba(126,224,138,0.35), 0 0 16px rgba(126,224,138,0.3); transform: translateY(-3px); }
  .tcard.poor { opacity: 0.42; filter: saturate(0.4); }
  .tcard canvas { display: block; width: 126px; height: 98px; margin: 0 auto; }
  .tcard .tn { font-size: 13px; font-weight: 900; letter-spacing: 0.3px; text-transform: uppercase; color: #e5f5df; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  .tcard .tc { font-size: 15px; font-weight: 900; color: #ffd257; margin-top: 3px; }
  .tcard .tc::before { content: '◉'; font-size: 9px; margin-right: 2px; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .gameTitle {
    font-size: 58px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase;

  .subTitle { font-size: 12px; letter-spacing: 4px; color: rgba(180,220,180,0.6); margin-top: -6px; text-transform: uppercase; }

  .bigBtn {
    font-family: inherit; font-weight: 900; font-size: 18px; letter-spacing: 2px;

    color: #06210c; background: linear-gradient(180deg, #b6ffc0, #63d97a 55%, #33a94c);
    box-shadow: 0 5px 0 #1e6b31, 0 12px 28px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.6);

  .bigBtn:hover { filter: brightness(1.1); }
  .bigBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1e6b31, 0 6px 16px rgba(0,0,0,0.5); }
  .bigBtn.orange { border-color: rgba(255,220,130,0.5); color: #2a1e05; background: linear-gradient(180deg, #ffd97a, #f0a83a 55%, #d97a10); box-shadow: 0 5px 0 #8a5508, 0 12px 28px rgba(0,0,0,0.5); }

  .bigBtn.blue { border-color: rgba(140,200,255,0.5); color: #052040; background: linear-gradient(180deg, #a8d8ff, #5a9ae0 55%, #2a6ab0); box-shadow: 0 5px 0 #1a4a80, 0 12px 28px rgba(0,0,0,0.5); }
  .bigBtn.blue:active { box-shadow: 0 2px 0 #1a4a80, 0 6px 16px rgba(0,0,0,0.5); }

    font-family: inherit; font-weight: 900; font-size: 13px; letter-spacing: 1.5px;

  /* Level grid */

    display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px;

  .lvlBtn {
    aspect-ratio: 1; border-radius: 7px; font-family: inherit; font-weight: 900; font-size: 13px;

  /* Highscore */

  #scoreList::-webkit-scrollbar { width: 6px; }
  #scoreList::-webkit-scrollbar-thumb { background: rgba(140,205,145,0.35); border-radius: 3px; }
  .scoreItem {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: rgba(40, 60, 45, 0.7); border-radius: 7px; border: 1px solid rgba(140,205,145,0.15);
  }
  .scoreItem .siLevel { font-weight: 900; color: #9fe0ff; font-size: 14px; min-width: 90px; }
  .scoreItem .siScore { font-weight: 900; color: #ffd257; font-size: 14px; min-width: 80px; }
  .scoreItem .siDate { font-size: 11px; color: #8fa88f; flex: 1; }
  .scoreItem .siRetry {
    font-family: inherit; font-weight: 900; font-size: 11px; letter-spacing: 1px;
    padding: 5px 14px; border-radius: 6px; border: 1px solid rgba(160,240,170,0.4);
    background: linear-gradient(180deg, #4a9a5a, #2a6a3a); color: #e8ffe0; cursor: pointer;
  }
  .emptyMsg { color: #8fa88f; text-align: center; padding: 30px; font-style: italic; }

  /* Game over */
  #gameOverScreen { background: radial-gradient(circle at 50% 45%, rgba(6,14,9,0.8), rgba(2,6,4,0.96)); }
  #overTitle { font-size: 48px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 4px 0 rgba(0,0,0,0.5); }
  #overSub { font-size: 15px; color: #b7cbb4; }
  #overStats { display: flex; gap: 20px; font-size: 14px; }
  #overStats .os { text-align: center; }
  #overStats .os b { display: block; font-size: 22px; color: #ffd257; }
  #overStats .os span { font-size: 10px; letter-spacing: 1px; color: #8fa88f; text-transform: uppercase; }

  /* Shop button (bonus panel is not needed on mobile-friendly design) */

  /* Small hint text */
  #hint {
    position: absolute; left: 10px; top: 8px; font-size: 9px; letter-spacing: 0.5px; line-height: 1.5;
    color: rgba(200,225,200,0.45); z-index: 5; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #buildVersion {
    position: absolute; right: 10px; bottom: 8px; z-index: 5; pointer-events: none;
    font-size: 9px; letter-spacing: 0.8px; color: rgba(220,240,220,0.45);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);

<body>
<div id="wrap">
  <canvas id="game" width="1000" height="640"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div class="stat"><span class="ico heart">❤</span><span id="lives">3</span></div>
    <div class="stat"><span class="ico coin">◉</span><span id="gold">500</span></div>

  <div id="buildBar" class="hidden">
    <div class="shopHeading"><span class="shopTitle" id="shopTitle">SHOP</span><span class="shopSubtitle" id="shopSubtitle">CHOOSE WHAT YOU NEED</span></div>

      <button id="buyTowersBtn"><strong>⚔ BUY TOWERS</strong><span>Browse and place your defenses</span></button>

<script>
(() => {
'use strict';

/* ============================================================
   HELPERS
   ============================================================ */
const W = 1000, H = 640, TAU = Math.PI * 2, TOTAL_LEVELS = 100;

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);

function angleLerp(a, b, t) {
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * t;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
}

function pointSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 > 0 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}

function distanceToPolyline(px, py, pts) {
  let min = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = pointSegDist(px, py, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
    if (d < min) min = d;
  }
  return min;
}

/* ============================================================
   LEVEL GENERATOR — 100 unique levels
   ============================================================ */
const TERRAIN_NONE = 'none', TERRAIN_RIVER = 'river', TERRAIN_LAKE = 'lake', TERRAIN_MOUNTAIN = 'mountain';

function generateLevel(N) {
  const rnd = mulberry32(N * 99991 + 7);
  const waypoints = [];

  // Start on left edge
  const startY = 80 + rnd() * 420;
  waypoints.push({ x: -60, y: startY });

  // 4-6 intermediate waypoints with varying x
  const numMid = 4 + Math.floor(rnd() * 3);
  const xs = [];
  for (let i = 1; i <= numMid; i++) {
    // Spread x across map with jitter
    let x = (i / (numMid + 1)) * 900 + 60 + (rnd() - 0.5) * 100;
    xs.push(x);
  }
  xs.sort((a, b) => a - b);

  for (let i = 0; i < numMid; i++) {
    const x = xs[i];
    const y = 80 + rnd() * 440;
    waypoints.push({ x, y });
  }

  // End on right edge
  const endY = 80 + rnd() * 420;
  waypoints.push({ x: 1060, y: endY });

  // Terrain based on level theme
  let terrain = null;
  const themeIdx = (N - 1) % 5;
  if (themeIdx === 1 || themeIdx === 3) {
    // River (vertical or horizontal)
    if (rnd() > 0.5) {
      const rx = 180 + rnd() * 640;
      terrain = { type: TERRAIN_RIVER, x: rx, y: 0, w: 70 + rnd() * 40, h: H };
    } else {
      const ry = 150 + rnd() * 340;
      terrain = { type: TERRAIN_RIVER, x: 0, y: ry, w: W, h: 70 + rnd() * 40 };
    }
  } else if (themeIdx === 2) {
    terrain = {
      type: TERRAIN_LAKE,
      x: 150 + rnd() * 700,
      y: 120 + rnd() * 400,
      r: 90 + rnd() * 60
    };
  } else if (themeIdx === 4) {
    terrain = {
      type: TERRAIN_MOUNTAIN,
      x: 150 + rnd() * 700,
      y: 120 + rnd() * 400,
      r: 110 + rnd() * 60
    };
  }

  // Foundations - scatter near path
  const foundations = [];
  const pathSamples = [];
  for (let i = 0; i < waypoints.length - 1; i++) {
    const a = waypoints[i], b = waypoints[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const steps = Math.max(1, Math.floor(len / 30));
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      pathSamples.push({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
    }
  }

  // Place foundations adjacent to path
  const targetCount = 10;
  let attempts = 0;
  while (foundations.length < targetCount && attempts < 300) {
    attempts++;
    const sample = pathSamples[Math.floor(rnd() * pathSamples.length)];
    const side = rnd() > 0.5 ? 1 : -1;
    const nx = (rnd() - 0.5) * 40;
    const ny = (rnd() - 0.5) * 40;
    const offset = 60 + rnd() * 40;
    const fx = sample.x + nx + (side * offset) * (rnd() > 0.5 ? 1 : -1) * 0.5;
    const fy = sample.y + ny + (side * offset) * (rnd() > 0.5 ? 1 : -1) * 0.5;

    if (fx < 40 || fx > W - 40 || fy < 60 || fy > H - 120) continue;
    if (distanceToPolyline(fx, fy, waypoints) < 45) continue;

    let tooClose = false;
    for (const f of foundations) {
      if (dist(fx, fy, f.x, f.y) < 55) { tooClose = true; break; }
    }
    if (tooClose) continue;

    // Determine placement type based on terrain
    let placement = 'land';
    if (terrain) {
      if (terrain.type === TERRAIN_RIVER) {
        if (fx >= terrain.x && fx <= terrain.x + terrain.w &&
            fy >= terrain.y && fy <= terrain.y + terrain.h) {
          placement = 'water';
        }
      } else if (terrain.type === TERRAIN_LAKE) {
        if (dist(fx, fy, terrain.x, terrain.y) <= terrain.r - 8) {
          placement = 'water';
        }
      } else if (terrain.type === TERRAIN_MOUNTAIN) {
        if (dist(fx, fy, terrain.x, terrain.y) <= terrain.r - 8) {
          placement = 'mountain';
        }
      }
    }

    foundations.push({ x: fx, y: fy, placement });
  }

  // Ensure at least some water/mountain foundations if terrain exists
  if (terrain) {
    const waterCount = foundations.filter(f => f.placement !== 'land').length;
    if (waterCount === 0) {
      // Force-add a couple
      for (let i = 0; i < 2; i++) {
        let fx, fy;
        if (terrain.type === TERRAIN_RIVER) {
          fx = terrain.x + terrain.w / 2 + (rnd() - 0.5) * (terrain.w - 20);
          fy = 100 + rnd() * (H - 200);
        } else {
          const a = rnd() * TAU;
          fx = terrain.x + Math.cos(a) * terrain.r * 0.5;
          fy = terrain.y + Math.sin(a) * terrain.r * 0.5;
        }
        if (fx > 60 && fx < W - 60 && fy > 80 && fy < H - 130) {
          foundations.push({ x: fx, y: fy, placement: terrain.type === TERRAIN_MOUNTAIN ? 'mountain' : 'water' });
        }
      }
    }
  }

  // Wave config based on level
  const wave = generateWave(N);

  return { N, waypoints, terrain, foundations, wave };
}

function generateWave(N) {
  const rnd = mulberry32(N * 131 + 11);
  const groups = [];

  // Difficulty tier
  const tier = Math.floor((N - 1) / 10); // 0-9
  const hpMul = 1 + (N - 1) * 0.22;

  // Base enemy pool grows with level
  const pools = [
    ['goblin'],
    ['goblin', 'wolf'],
    ['goblin', 'wolf', 'orc'],
    ['goblin', 'wolf', 'orc', 'skeleton'],
    ['goblin', 'wolf', 'orc', 'skeleton', 'shaman'],
    ['goblin', 'wolf', 'orc', 'skeleton', 'shaman', 'slime'],
    ['goblin', 'wolf', 'orc', 'skeleton', 'shaman', 'slime', 'ogre'],
    ['goblin', 'wolf', 'orc', 'skeleton', 'shaman', 'slime', 'ogre', 'wraith'],
    ['goblin', 'wolf', 'orc', 'skeleton', 'shaman', 'slime', 'ogre', 'wraith', 'demon'],
    ['goblin', 'wolf', 'orc', 'skeleton', 'shaman', 'slime', 'ogre', 'wraith', 'demon', 'dark_knight', 'dragon']
  ];
  const pool = pools[Math.min(9, tier)];

  // 2-4 different enemy groups per wave
  const numGroups = 2 + Math.floor(rnd() * 3);
  const usedTypes = new Set();
  for (let g = 0; g < numGroups; g++) {
    let type;
    let tries = 0;
    do {
      type = pool[Math.floor(rnd() * pool.length)];
      tries++;
    } while (usedTypes.has(type) && tries < 20);
    usedTypes.add(type);

    const count = 3 + Math.floor(rnd() * (5 + tier * 2));
    const gap = 0.4 + rnd() * 0.6;
    const delay = g * (1.5 + rnd() * 2);
    groups.push({ type, count, gap, delay });
  }

  // Boss dragon at multiples of 25
  if (N % 25 === 0) {
    groups.push({ type: 'dragon', count: 1 + Math.floor(N / 25 - 1), gap: 3, delay: 4 });
  }

  return { groups, hpMul };
}

/* ============================================================
   BACKGROUND BUILDER (per level)
   ============================================================ */
function drawPineTree(g, x, y, scale, rnd) {
  g.save(); g.translate(x, y); g.scale(scale, scale);
  g.fillStyle = 'rgba(8,26,14,0.3)';
  g.beginPath(); g.ellipse(5, 7, 24, 9, 0, 0, TAU); g.fill();
  const tg = g.createLinearGradient(-4, 0, 4, 0);
  tg.addColorStop(0, '#4a2f19'); tg.addColorStop(0.45, '#7a4f2a'); tg.addColorStop(1, '#3a2413');
  g.fillStyle = tg;
  g.beginPath(); g.moveTo(-4, 8); g.lineTo(-3, -14); g.lineTo(3, -14); g.lineTo(4, 8); g.closePath(); g.fill();
  for (let i = 0; i < 4; i++) {
    const yy = -8 - i * 12, w = 26 - i * 5.2, hgt = 22 - i * 2.6;
    const grad = g.createLinearGradient(-w, yy - hgt, w, yy + 6);
    grad.addColorStop(0, '#57a95c'); grad.addColorStop(0.45, '#37814a'); grad.addColorStop(1, '#1a5230');
    g.fillStyle = grad;
    g.beginPath(); g.moveTo(0, yy - hgt);
    g.quadraticCurveTo(w * 0.65, yy - hgt * 0.32, w, yy + 5);
    g.quadraticCurveTo(0, yy + 12, -w, yy + 5);
    g.quadraticCurveTo(-w * 0.65, yy - hgt * 0.32, 0, yy - hgt);
    g.closePath(); g.fill();
  }
  g.restore();
}

function drawRock(g, x, y, scale, rnd) {
  g.save(); g.translate(x, y); g.scale(scale, scale);
  g.fillStyle = 'rgba(8,26,14,0.28)';
  g.beginPath(); g.ellipse(3, 5, 15, 6, 0, 0, TAU); g.fill();
  const grad = g.createLinearGradient(-12, -12, 12, 12);
  grad.addColorStop(0, '#c3c8cc'); grad.addColorStop(0.42, '#94999f'); grad.addColorStop(1, '#565c63');
  g.fillStyle = grad;
  const pts = [];
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * TAU, r = 10 + rnd() * 5;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r * 0.72 });
  }
  g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  g.closePath(); g.fill();
  g.restore();
}

function buildLevelBackground(level) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const rnd = mulberry32(level.N * 777 + 3);
  const pts = level.waypoints;
  const terrain = level.terrain;

  // Base grass
  const baseGrad = g.createLinearGradient(0, 0, W * 0.7, H);
  baseGrad.addColorStop(0, '#57954c'); baseGrad.addColorStop(0.4, '#417f3e');
  baseGrad.addColorStop(0.75, '#356b36'); baseGrad.addColorStop(1, '#28552e');
  g.fillStyle = baseGrad; g.fillRect(0, 0, W, H);

  // Mottled patches
  for (let i = 0; i < 80; i++) {
    const x = rnd() * W, y = rnd() * H, r = 34 + rnd() * 140;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, rnd() > 0.5 ? 'rgba(158,210,118,0.15)' : 'rgba(16,50,24,0.20)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }

  // Terrain rendering
  if (terrain) {
    if (terrain.type === TERRAIN_RIVER) {
      // River band
      const rg = g.createLinearGradient(0, terrain.y, 0, terrain.y + terrain.h);
      rg.addColorStop(0, 'rgba(60,120,180,0.85)');
      rg.addColorStop(0.5, 'rgba(80,150,210,0.9)');
      rg.addColorStop(1, 'rgba(50,110,170,0.85)');
      g.fillStyle = rg;
      if (terrain.w < H) {
        g.fillRect(terrain.x, 0, terrain.w, H);
      } else {
        g.fillRect(0, terrain.y, W, terrain.h);
      }
      // River highlights
      g.save();
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 60; i++) {
        let hx, hy;
        if (terrain.w < H) {
          hx = terrain.x + rnd() * terrain.w;
          hy = rnd() * H;
        } else {
          hx = rnd() * W;
          hy = terrain.y + rnd() * terrain.h;
        }
        g.fillStyle = `rgba(200, 230, 255, ${0.15 + rnd() * 0.25})`;
        g.beginPath(); g.ellipse(hx, hy, 6 + rnd() * 12, 1.5 + rnd() * 2, 0, 0, TAU); g.fill();
      }
      g.restore();
      // Bank shading
      g.strokeStyle = 'rgba(60,40,20,0.4)';
      g.lineWidth = 6;
      if (terrain.w < H) {
        g.beginPath(); g.moveTo(terrain.x, 0); g.lineTo(terrain.x, H); g.stroke();
        g.beginPath(); g.moveTo(terrain.x + terrain.w, 0); g.lineTo(terrain.x + terrain.w, H); g.stroke();
      } else {
        g.beginPath(); g.moveTo(0, terrain.y); g.lineTo(W, terrain.y); g.stroke();
        g.beginPath(); g.moveTo(0, terrain.y + terrain.h); g.lineTo(W, terrain.y + terrain.h); g.stroke();
      }
    } else if (terrain.type === TERRAIN_LAKE) {
      const lg = g.createRadialGradient(terrain.x - terrain.r * 0.3, terrain.y - terrain.r * 0.3, terrain.r * 0.2, terrain.x, terrain.y, terrain.r);
      lg.addColorStop(0, 'rgba(120, 200, 240, 0.95)');
      lg.addColorStop(0.7, 'rgba(70, 150, 200, 0.9)');
      lg.addColorStop(1, 'rgba(40, 100, 150, 0.85)');
      g.fillStyle = lg;
      g.beginPath(); g.arc(terrain.x, terrain.y, terrain.r, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(60,40,20,0.5)'; g.lineWidth = 8;
      g.beginPath(); g.arc(terrain.x, terrain.y, terrain.r, 0, TAU); g.stroke();
      // Sparkles
      g.save(); g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 40; i++) {
        const a = rnd() * TAU;
        const r = rnd() * terrain.r * 0.85;
        const sx = terrain.x + Math.cos(a) * r;
        const sy = terrain.y + Math.sin(a) * r;
        g.fillStyle = `rgba(220, 240, 255, ${0.2 + rnd() * 0.4})`;
        g.beginPath(); g.arc(sx, sy, 1 + rnd() * 1.8, 0, TAU); g.fill();
      }
      g.restore();
    } else if (terrain.type === TERRAIN_MOUNTAIN) {
      // Mountain base circle
      g.save();
      g.translate(terrain.x, terrain.y);
      const mg = g.createRadialGradient(-terrain.r * 0.3, -terrain.r * 0.3, terrain.r * 0.15, 0, 0, terrain.r);
      mg.addColorStop(0, '#a89a8a');
      mg.addColorStop(0.5, '#7a6a58');
      mg.addColorStop(1, '#4a3f32');
      g.fillStyle = mg;
      g.beginPath(); g.arc(0, 0, terrain.r, 0, TAU); g.fill();
      // Rock texture
      for (let i = 0; i < 25; i++) {
        const a = rnd() * TAU;
        const r = rnd() * terrain.r * 0.85;
        const rx = Math.cos(a) * r, ry = Math.sin(a) * r;
        g.fillStyle = rnd() > 0.5 ? 'rgba(60,50,40,0.5)' : 'rgba(180,170,150,0.4)';
        g.beginPath(); g.ellipse(rx, ry, 4 + rnd() * 8, 3 + rnd() * 5, rnd() * TAU, 0, TAU); g.fill();
      }
      // Rocky edges
      g.strokeStyle = 'rgba(40,30,20,0.6)'; g.lineWidth = 5;
      g.beginPath(); g.arc(0, 0, terrain.r - 2, 0, TAU); g.stroke();
      g.restore();
    }
  }

  // Grass blades (skip over terrain mostly)
  g.lineCap = 'round';
  for (let i = 0; i < 2200; i++) {
    const x = rnd() * W, y = rnd() * H;
    if (terrain) {
      if (terrain.type === TERRAIN_RIVER) {
        if (terrain.w < H && x >= terrain.x && x <= terrain.x + terrain.w) continue;
        if (terrain.w >= H && y >= terrain.y && y <= terrain.y + terrain.h) continue;
      } else if (terrain.type === TERRAIN_LAKE && dist(x, y, terrain.x, terrain.y) <= terrain.r) continue;
      else if (terrain.type === TERRAIN_MOUNTAIN && dist(x, y, terrain.x, terrain.y) <= terrain.r) continue;
    }
    const h = 4 + rnd() * 8, lean = (rnd() - 0.5) * 5;
    const s = rnd();
    g.strokeStyle = s > 0.72 ? 'rgba(160,216,120,0.50)' : s > 0.36 ? 'rgba(100,168,84,0.50)' : 'rgba(44,102,52,0.55)';
    g.lineWidth = 0.9 + rnd() * 0.9;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * 0.5, y - h * 0.62, x + lean, y - h); g.stroke();
  }

  // Road shadow
  g.save(); g.translate(3, 7);
  g.strokeStyle = 'rgba(8,26,14,0.30)'; g.lineWidth = 68;
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  g.stroke(); g.restore();

  // Road layers
  function strokeRoad(w, c) {
    g.strokeStyle = c; g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round';
    g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
    g.stroke();
  }
  strokeRoad(66, '#655a4b'); strokeRoad(60, '#8a7b64');
  strokeRoad(48, '#a97f52'); strokeRoad(39, '#bd9259');
  strokeRoad(22, '#cba46c');

  // Stones lining road edges
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    const steps = Math.floor(len / 15);
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const sx = lerp(a.x, b.x, t);
      const sy = lerp(a.y, b.y, t);
      for (let side = -1; side <= 1; side += 2) {
        const nx = -Math.sin(angle) * side;
        const ny = Math.cos(angle) * side;
        const off = 32 + rnd() * 5;
        const px = sx + nx * off;
        const py = sy + ny * off;
        const rw = 4 + rnd() * 3.4, rh = 3 + rnd() * 2.6;
        const rg2 = g.createRadialGradient(px - rw * 0.35, py - rh * 0.4, 0.5, px, py, rw * 1.3);
        rg2.addColorStop(0, '#b7b3a8'); rg2.addColorStop(0.6, '#8a857a'); rg2.addColorStop(1, '#5d594f');
        g.fillStyle = rg2;
        g.beginPath(); g.ellipse(px, py, rw, rh, rnd() * TAU, 0, TAU); g.fill();
      }
    }
  }

  // Decorative trees & rocks
  for (let i = 0; i < 200; i++) {
    const x = 20 + rnd() * (W - 40), y = 24 + rnd() * (H - 130);
    if (distanceToPolyline(x, y, pts) < 55) continue;
    if (terrain) {
      if (terrain.type === TERRAIN_RIVER) {
        if (terrain.w < H && x >= terrain.x - 15 && x <= terrain.x + terrain.w + 15) continue;
        if (terrain.w >= H && y >= terrain.y - 15 && y <= terrain.y + terrain.h + 15) continue;
      } else if (terrain.type === TERRAIN_LAKE && dist(x, y, terrain.x, terrain.y) < terrain.r + 20) continue;
      else if (terrain.type === TERRAIN_MOUNTAIN && dist(x, y, terrain.x, terrain.y) < terrain.r + 20) continue;
    }
    let tooClose = false;
    for (const f of level.foundations) {
      if (dist(x, y, f.x, f.y) < 45) { tooClose = true; break; }
    }
    if (tooClose) continue;
    if (rnd() > 0.35) drawPineTree(g, x, y, 0.5 + rnd() * 0.6, rnd);
    else drawRock(g, x, y, 0.5 + rnd() * 0.55, rnd);
  }

  // Vignette
  const vig = g.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.92);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(4,14,8,0.55)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);

  return cv;
}

/* ============================================================
   TOWER CATALOG — 28 towers with UNIQUE attack behaviors
   ============================================================ */
const TOWERS = [];

function defTower(cfg) {
  const levels = [];
  for (let i = 0; i < 3; i++) {
    const m = 1 + i * 0.55;
    const lv = { range: Math.round(cfg.range * (1 + i * 0.12)) };
    if (cfg.damage !== undefined) lv.damage = Math.round(cfg.damage * m);
    if (cfg.cooldown !== undefined) lv.cooldown = +(cfg.cooldown * (1 - i * 0.11)).toFixed(2);
    if (cfg.splash !== undefined) lv.splash = Math.round(cfg.splash * m);
    if (cfg.slow !== undefined) { lv.slow = cfg.slow; lv.slowDuration = cfg.slowDuration; }
    if (cfg.poisonDps !== undefined) { lv.poisonDps = Math.round(cfg.poisonDps * m); lv.poisonDuration = cfg.poisonDuration; }
    if (cfg.jumps !== undefined) { lv.jumps = cfg.jumps + (i > 0 ? 1 : 0); lv.chainRange = cfg.chainRange; }
    if (cfg.projectileSpeed !== undefined) lv.projectileSpeed = cfg.projectileSpeed + i * 40;
    if (cfg.allyHp !== undefined) {
      lv.allyHp = Math.round(cfg.allyHp * m);
      lv.allyDamage = Math.round(cfg.allyDamage * m);
      lv.allySpeed = cfg.allySpeed; lv.allyRange = cfg.allyRange; lv.allyAttackSpeed = cfg.allyAttackSpeed;
      lv.maxAllies = cfg.maxAllies; lv.spawnInterval = cfg.spawnInterval; lv.leashRange = cfg.leashRange;
    }
    if (cfg.goldPerTick !== undefined) lv.goldPerTick = Math.round(cfg.goldPerTick * (1 + i * 0.5));
    if (cfg.buffDamage !== undefined) lv.buffDamage = cfg.buffDamage + i * 0.06;
    if (cfg.buffSpeed !== undefined) lv.buffSpeed = cfg.buffSpeed + i * 0.05;
    if (cfg.buffRange !== undefined) lv.buffRange = cfg.buffRange + i * 0.06;
    if (cfg.auraDps !== undefined) lv.auraDps = Math.round(cfg.auraDps * m);
    if (cfg.mineDamage !== undefined) { lv.mineDamage = Math.round(cfg.mineDamage * m); lv.mineSplash = cfg.mineSplash; }
    levels.push(lv);
  }
  const t = {
    id: 'T' + TOWERS.length,
    name: cfg.name,
    category: cfg.category, // archer, artillery, wizard, camp, support, water, mountain
    behavior: cfg.behavior,
    placement: cfg.placement || 'land',
    cost: cfg.cost,
    visual: cfg.visual,
    levels,
    upgradeCost: [Math.round(cfg.cost * 0.85), Math.round(cfg.cost * 1.4)],
    allyType: cfg.allyType || null,
    desc: cfg.desc || ''
  };
  TOWERS.push(t);
  return t;
}

/* ============================================================
   PATH MANAGER
   ============================================================ */
class PathManager {
  constructor(pts) {
    this.points = pts;
    this.segments = [];
    this.totalLength = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      this.segments.push({ a, b, len, start: this.totalLength });
      this.totalLength += len;
    }
  }
  getPoint(d) {
    d = clamp(d, 0, this.totalLength);
    for (const s of this.segments) {
      if (d <= s.start + s.len) {
        const t = s.len > 0 ? (d - s.start) / s.len : 0;
        return {
          x: lerp(s.a.x, s.b.x, t), y: lerp(s.a.y, s.b.y, t),
          angle: Math.atan2(s.b.y - s.a.y, s.b.x - s.a.x)
        };
      }
    }
    const last = this.segments[this.segments.length - 1];
    return { x: last.b.x, y: last.b.y, angle: Math.atan2(last.b.y - last.a.y, last.b.x - last.a.x) };
  }
}

/* ============================================================
   PARTICLES / TEXT / BEAMS
   ============================================================ */
class Particle {
  constructor(o) {
    this.x = o.x; this.y = o.y;
    this.vx = o.vx || 0; this.vy = o.vy || 0;
    this.life = o.life || 0.6; this.maxLife = this.life;
    this.size = o.size || 3; this.color = o.color || '255,255,255';
    this.type = o.type || 'circle';
    this.gravity = o.gravity || 0;
    this.drag = o.drag !== undefined ? o.drag : 0.94;
    this.spin = o.spin || 0; this.rot = o.rot || 0;
    this.growth = o.growth || 0; this.dead = false;
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    this.vy += this.gravity * dt;
    const d = Math.pow(this.drag, dt * 60);
    this.vx *= d; this.vy *= d;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.rot += this.spin * dt; this.size += this.growth * dt;
  }
  draw(ctx) {
    const a = clamp(this.life / this.maxLife, 0, 1);
    if (this.type === 'circle') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2.4);
      g.addColorStop(0, `rgba(${this.color}, ${a * 0.95})`);
      g.addColorStop(0.45, `rgba(${this.color}, ${a * 0.36})`);
      g.addColorStop(1, `rgba(${this.color}, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 2.4, 0, TAU); ctx.fill();
      ctx.restore(); return;
    }
    if (this.type === 'smoke') {
      ctx.save();
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
      g.addColorStop(0, `rgba(${this.color}, ${a * 0.55})`);
      g.addColorStop(1, `rgba(${this.color}, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, TAU); ctx.fill();
      ctx.restore(); return;
    }
    if (this.type === 'ring') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const r = this.size * (1 + (1 - a) * 3.2);
      ctx.strokeStyle = `rgba(${this.color}, ${a * 0.8})`;
      ctx.lineWidth = Math.max(0.6, 4.2 * a);
      ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, TAU); ctx.stroke();
      ctx.restore(); return;
    }
    if (this.type === 'shard') {
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(${this.color}, ${a})`;
      ctx.beginPath();
      ctx.moveTo(-this.size, -this.size * 0.42);
      ctx.lineTo(this.size, 0);
      ctx.lineTo(-this.size, this.size * 0.42);
      ctx.closePath(); ctx.fill();
      ctx.restore(); return;
    }
    // spark
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(${this.color}, ${a})`;
    ctx.lineWidth = Math.max(0.7, this.size * 0.7);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.vx * 0.028, this.y - this.vy * 0.028); ctx.stroke();
    ctx.restore();
  }
}

class FloatText {
  constructor(text, x, y, color, size) {
    this.text = text; this.x = x; this.y = y;
    this.color = color || '#ffe08a'; this.size = size || 15;
    this.life = 1.1; this.maxLife = 1.1; this.vy = -46; this.dead = false;
  }
  update(dt) {
    this.life -= dt; this.y += this.vy * dt;
    this.vy *= Math.pow(0.94, dt * 60);
    if (this.life <= 0) this.dead = true;
  }
  draw(ctx) {
    const a = clamp(this.life / this.maxLife, 0, 1);
    const pop = 1 + (1 - a) * 0.28;
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `900 ${this.size * pop}px 'Trebuchet MS', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3.4; ctx.strokeStyle = 'rgba(0,0,0,0.62)';
    ctx.strokeText(this.text, this.x, this.y);
    ctx.fillStyle = this.color;
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

class Beam {
  constructor(x1, y1, x2, y2, color, segs) {
    this.x1 = x1; this.y1 = y1; this.x2 = x2; this.y2 = y2;
    this.color = color; this.life = 0.18; this.maxLife = 0.18; this.dead = false;
    this.offsets = [];
    const n = segs || 7;
    for (let i = 0; i <= n; i++) {
      this.offsets.push(i === 0 || i === n ? 0 : (Math.random() - 0.5) * 12);
    }
  }
  update(dt) { this.life -= dt; if (this.life <= 0) this.dead = true; }
  draw(ctx) {
    const a = clamp(this.life / this.maxLife, 0, 1);
    const n = this.offsets.length - 1;
    const dx = this.x2 - this.x1, dy = this.y2 - this.y1;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 3; pass++) {
      ctx.beginPath();
      ctx.moveTo(this.x1, this.y1);
      for (let i = 1; i <= n; i++) {
        const k = i / n;
        const off = this.offsets[i];
        ctx.lineTo(lerp(this.x1, this.x2, k) + nx * off, lerp(this.y1, this.y2, k) + ny * off);
      }
      if (pass === 0) { ctx.strokeStyle = `rgba(${this.color}, ${0.36 * a})`; ctx.lineWidth = 10; }
      else if (pass === 1) { ctx.strokeStyle = `rgba(${this.color}, ${0.85 * a})`; ctx.lineWidth = 4; }
      else { ctx.strokeStyle = `rgba(250,240,255, ${0.95 * a})`; ctx.lineWidth = 1.6; }
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ============================================================
   PROJECTILES (multiple types)
   ============================================================ */
function predictIntercept(tx, ty, ex, ey, evx, evy, speed) {
  const dx = ex - tx, dy = ey - ty;
  const a = speed * speed - (evx * evx + evy * evy);
  const b = -2 * (dx * evx + dy * evy);
  const c = -(dx * dx + dy * dy);
  if (Math.abs(a) < 1e-6) {
    if (Math.abs(b) < 1e-6) return { x: ex, y: ey };
    const t0 = -c / b;
    if (t0 > 0 && isFinite(t0)) return { x: ex + evx * t0, y: ey + evy * t0 };
    return { x: ex, y: ey };
  }
  const disc = b * b - 4 * a * c;
  if (disc < 0) return { x: ex, y: ey };
  const sq = Math.sqrt(disc);
  const t1 = (-b + sq) / (2 * a), t2 = (-b - sq) / (2 * a);
  let t = Infinity;
  if (t1 > 0) t = Math.min(t, t1);
  if (t2 > 0) t = Math.min(t, t2);
  if (!isFinite(t)) return { x: ex, y: ey };
  return { x: ex + evx * t, y: ey + evy * t };
}

class ArrowProj {
  constructor(g, x, y, target, damage, speed, color, poison) {
    this.g = g; this.x = x; this.y = y;
    this.target = target; this.damage = damage; this.speed = speed;
    this.color = color || '255, 232, 170';
    this.poison = poison || null;
    this.angle = Math.atan2(target.y - y, target.x - x);
    this.life = 2.5; this.dead = false;
  }
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    const t = this.target;
    let aimX, aimY;
    if (t && !t.dead) {
      const ip = predictIntercept(this.x, this.y, t.x, t.y, t.vx, t.vy, this.speed);
      aimX = ip.x; aimY = ip.y;
    } else { aimX = this.x + Math.cos(this.angle) * 120; aimY = this.y + Math.sin(this.angle) * 120; }
    const desired = Math.atan2(aimY - this.y, aimX - this.x);
    this.angle = angleLerp(this.angle, desired, 1 - Math.pow(0.0001, dt));
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;

    if (t && !t.dead && dist(this.x, this.y, t.x, t.y) < t.radius + 7) {
      t.takeDamage(this.damage);
      if (this.poison && !t.dead) t.applyPoison(this.poison.dps, this.poison.duration);
      this.dead = true;
    }
    if (this.x < -60 || this.x > W + 60 || this.y < -60 || this.y > H + 60) this.dead = true;
  }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
    ctx.fillStyle = `rgba(${this.color}, 0.45)`;
    ctx.beginPath(); ctx.ellipse(-8, 0, 8, 2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = this.poison ? '#7adf3a' : '#d9c08c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(6, 0); ctx.stroke();
    ctx.fillStyle = this.poison ? '#baff80' : '#dfe6ee';
    ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(4, -2.5); ctx.lineTo(4, 2.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

class MortarProj {
  constructor(g, x, y, tx, ty, damage, splash, color) {
    this.g = g; this.sx = x; this.sy = y; this.tx = tx; this.ty = ty;
    this.x = x; this.y = y; this.damage = damage; this.splash = splash;
    this.color = color || '255, 180, 90';
    this.t = 0;
    const d = Math.hypot(tx - x, ty - y);
    this.duration = Math.max(0.4, d / 300);
    this.arcHeight = 55 + d * 0.35;
    this.rot = 0; this.groundY = y; this.dead = false;
  }
  update(dt) {
    this.t += dt;
    const k = Math.min(1, this.t / this.duration);
    this.x = lerp(this.sx, this.tx, k);
    this.groundY = lerp(this.sy, this.ty, k);
    this.y = this.groundY - Math.sin(k * Math.PI) * this.arcHeight;
    this.rot += dt * 10;
    if (k >= 1) { this.explode(); this.dead = true; }
  }
  explode() {
    const g = this.g;
    for (const e of g.enemies) {
      if (e.dead) continue;
      const d = dist(this.tx, this.ty, e.x, e.y);
      if (d <= this.splash + e.radius) {
        const falloff = 1 - 0.4 * clamp(d / this.splash, 0, 1);
        e.takeDamage(this.damage * falloff);
      }
    }
    for (let i = 0; i < 15; i++) {
      const a = Math.random() * TAU, s = 20 + Math.random() * 80;
      g.particles.push(new Particle({
        x: this.tx, y: this.ty, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.5 - 15,
        life: 0.6 + Math.random() * 0.5, size: 7 + Math.random() * 10,
        color: '92,86,78', type: 'smoke', drag: 0.9, growth: 12
      }));
    }
    g.particles.push(new Particle({
      x: this.tx, y: this.ty, life: 0.4, size: 6, color: this.color, type: 'ring', drag: 1
    }));
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI * 0.85 + Math.random() * Math.PI * 0.7;
      const s = 100 + Math.random() * 180;
      g.particles.push(new Particle({
        x: this.tx, y: this.ty, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.5, size: 2 + Math.random() * 2.5,
        color: this.color, type: 'shard', gravity: 600, drag: 0.98,
        spin: (Math.random() - 0.5) * 20, rot: Math.random() * TAU
      }));
    }
    g.shake = Math.max(g.shake, 5);
  }
  draw(ctx) {
    const k = Math.min(1, this.t / this.duration);
    const shScale = 1 - Math.sin(k * Math.PI) * 0.55;
    ctx.fillStyle = 'rgba(6,22,10,0.3)';
    ctx.beginPath(); ctx.ellipse(this.x, this.groundY + 4, 8 * shScale, 3.6 * shScale, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
    ctx.fillStyle = `rgba(${this.color}, 0.4)`;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
    const grad = ctx.createRadialGradient(-2, -2, 0.5, 0, 0, 6);
    grad.addColorStop(0, '#8f959d'); grad.addColorStop(0.6, '#3c4147'); grad.addColorStop(1, '#16191c');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, 5.6, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

class BoomerangProj {
  constructor(g, x, y, target, damage, speed, color) {
    this.g = g; this.sx = x; this.sy = y; this.x = x; this.y = y;
    this.target = target; this.damage = damage; this.speed = speed;
    this.color = color;
    this.t = 0; this.travelTime = 0.7; this.returnTime = 0.9;
    this.rot = 0; this.dead = false; this.hit = new Set();
    this.phase = 'out';
  }
  update(dt) {
    this.t += dt; this.rot += dt * 14;
    if (this.phase === 'out') {
      const k = this.t / this.travelTime;
      if (k >= 1) { this.phase = 'back'; this.t = 0; return; }
      const t = this.target;
      const tx = (t && !t.dead) ? t.x : this.sx + 100;
      const ty = (t && !t.dead) ? t.y : this.sy + 30;
      this.x = lerp(this.sx, tx, k);
      this.y = lerp(this.sy, ty, k) - Math.sin(k * Math.PI) * 40;
      this.checkHits();
    } else {
      const k = this.t / this.returnTime;
      if (k >= 1) { this.dead = true; return; }
      this.x = lerp(this.sx + 100, this.sx, k);
      this.y = lerp(this.sy + 30, this.sy, k) - Math.sin(k * Math.PI) * 30;
      this.checkHits();
    }
  }
  checkHits() {
    for (const e of this.g.enemies) {
      if (e.dead || this.hit.has(e)) continue;
      if (dist(this.x, this.y, e.x, e.y) < e.radius + 10) {
        e.takeDamage(this.damage);
        this.hit.add(e);
      }
    }
  }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
    ctx.fillStyle = `rgba(${this.color}, 0.55)`;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c8a060'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 8, Math.PI + 0.3, TAU - 0.3); ctx.stroke();
    ctx.restore();
  }
}

class MineProj {
  constructor(g, x, y, damage, splash, color) {
    this.g = g; this.x = x; this.y = y;
    this.damage = damage; this.splash = splash; this.color = color;
    this.armTime = 0.5; this.life = 12; this.dead = false;
    this.pulse = 0;
  }
  update(dt) {
    this.armTime -= dt; this.life -= dt; this.pulse += dt * 6;
    if (this.life <= 0) { this.dead = true; return; }
    if (this.armTime > 0) return;
    for (const e of this.g.enemies) {
      if (e.dead) continue;
      if (dist(this.x, this.y, e.x, e.y) < e.radius + 12) {
        this.explode();
        this.dead = true;
        return;
      }
    }
  }
  explode() {
    for (const e of this.g.enemies) {
      if (e.dead) continue;
      const d = dist(this.x, this.y, e.x, e.y);
      if (d <= this.splash + e.radius) e.takeDamage(this.damage);
    }
    this.g.particles.push(new Particle({
      x: this.x, y: this.y, life: 0.4, size: 6, color: this.color, type: 'ring', drag: 1
    }));
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * TAU, s = 60 + Math.random() * 150;
      this.g.particles.push(new Particle({
        x: this.x, y: this.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.4, size: 2, color: this.color, type: 'spark', drag: 0.94
      }));
    }
    this.g.shake = Math.max(this.g.shake, 4);
  }
  draw(ctx) {
    const armed = this.armTime <= 0;
    const r = 7 + (armed ? Math.sin(this.pulse) * 1.5 : 0);
    ctx.save(); ctx.translate(this.x, this.y);
    if (armed) {
      ctx.globalCompositeOperation = 'lighter';
      const gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 16);
      gl.addColorStop(0, `rgba(${this.color}, 0.6)`);
      gl.addColorStop(1, `rgba(${this.color}, 0)`);
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = armed ? '#ff4040' : '#666'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    ctx.fillStyle = armed ? '#ff8080' : '#888';
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   ENEMY BASE
   ============================================================ */
class Enemy {
  constructor(game, def, hpMul) {
    this.game = game; this.def = def; this.type = def.type;
    this.path = game.path;
    this.maxHp = Math.round(def.hp * hpMul);
    this.hp = this.maxHp;
    this.baseSpeed = def.speed;
    this.speedMul = 1;
    this.slowTimer = 0;
    this.armor = def.armor;
    this.gold = def.gold;
    this.radius = def.radius;
    this.distance = 0;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.anim = Math.random() * 10;
    this.hitFlash = 0;
    this.dead = false;
    this.escaped = false;
    this.poisonDps = 0;
    this.poisonTimer = 0;
    this.engagedAlly = null;
    this.atkCooldown = 0;
    const p = this.path.getPoint(0);
    this.x = p.x; this.y = p.y;
  }
  get speed() { return this.baseSpeed * this.speedMul; }
  applySlow(mult, dur) {
    if (mult < this.speedMul || this.slowTimer <= 0) this.speedMul = Math.min(this.speedMul, mult);
    this.slowTimer = Math.max(this.slowTimer, dur);
  }
  applyPoison(dps, dur) {
    this.poisonDps = Math.max(this.poisonDps, dps);
    this.poisonTimer = Math.max(this.poisonTimer, dur);
  }
  takeDamage(amount) {
    if (this.dead) return;
    this.hp -= amount * (1 - this.armor);
    this.hitFlash = 0.12;
    if (this.hp <= 0) { this.hp = 0; this.die(); }
  }
  die() {
    if (this.dead) return;
    this.dead = true;
    this.game.gold += this.gold;
    this.game.kills++;
    this.game.addText('+' + this.gold, this.x, this.y - 20, '#ffd257', 13);
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * TAU, s = 40 + Math.random() * 120;
      this.game.particles.push(new Particle({
        x: this.x, y: this.y - 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: 0.4 + Math.random() * 0.3, size: 1.6 + Math.random() * 2,
        color: this.deathColor(), type: 'shard', gravity: 460, drag: 0.97,
        spin: (Math.random() - 0.5) * 18, rot: Math.random() * TAU
      }));
    }
    this.game.particles.push(new Particle({
      x: this.x, y: this.y - 8, life: 0.4, size: 5 + this.radius * 0.3,
      color: this.deathColor(), type: 'ring', drag: 1
    }));
    if (this.type === 'slime' && this.radius > 8) {
      for (let i = 0; i < 2; i++) {
        const child = createEnemy(this.game, 'slime', 1);
        child.radius = this.radius * 0.65;
        child.maxHp = Math.round(this.maxHp * 0.4);
        child.hp = child.maxHp;
        child.gold = Math.round(this.gold * 0.5);
        child.distance = this.distance;
        const p = this.path.getPoint(this.distance);
        child.x = p.x + (i === 0 ? -10 : 10);
        child.y = p.y;
        this.game.enemies.push(child);
      }
    }
  }
  deathColor() {
    if (this.type === 'goblin' || this.type === 'slime') return '150, 230, 110';
    if (this.type === 'orc' || this.type === 'ogre') return '200, 180, 120';
    if (this.type === 'skeleton' || this.type === 'shaman') return '190, 150, 255';
    if (this.type === 'demon' || this.type === 'dragon') return '255, 120, 60';
    if (this.type === 'wolf') return '160, 160, 170';
    if (this.type === 'dark_knight') return '90, 90, 130';
    return '180, 180, 200';
  }
  update(dt) {
    this.anim += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.atkCooldown > 0) this.atkCooldown -= dt;
    if (this.slowTimer > 0) {
      this.slowTimer -= dt;
      if (this.slowTimer <= 0) this.speedMul = 1;
    }
    if (this.poisonTimer > 0) {
      this.poisonTimer -= dt;
      this.hp -= this.poisonDps * dt;
      if (this.hp <= 0) { this.hp = 0; this.die(); return; }
    }
    // Engage allies
    if (this.engagedAlly && this.engagedAlly.dead) this.engagedAlly = null;
    if (this.engagedAlly) {
      const d = dist(this.x, this.y, this.engagedAlly.x, this.engagedAlly.y);
      if (d > 50) this.engagedAlly = null;
      else {
        if (this.atkCooldown <= 0) {
          this.engagedAlly.takeDamage(this.def.dmg);
          this.atkCooldown = this.def.atkSpd;
        }
        return;
      }
    }
    // Check nearby allies
    for (const a of this.game.allies) {
      if (a.dead) continue;
      if (dist(this.x, this.y, a.x, a.y) < 40) {
        this.engagedAlly = a;
        return;
      }
    }
    this.distance += this.speed * dt;
    const p = this.path.getPoint(this.distance);
    this.vx = Math.cos(p.angle) * this.speed;
    this.vy = Math.sin(p.angle) * this.speed;
    this.x = p.x; this.y = p.y;
    if (Math.abs(this.vx) > 6) this.facing = this.vx > 0 ? 1 : -1;
    if (this.distance >= this.path.totalLength) {
      this.escaped = true;
      this.dead = true;
    }
  }
  draw(ctx) {
    this.drawSprite(ctx);
    if (this.slowTimer > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(this.x, this.y - this.radius * 0.4, 0, this.x, this.y - this.radius * 0.4, this.radius * 2);
      g.addColorStop(0, 'rgba(120,200,255,0.34)'); g.addColorStop(1, 'rgba(90,170,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(this.x, this.y - this.radius * 0.4, this.radius * 2, 0, TAU); ctx.fill();
      ctx.restore();
    }
    if (this.poisonTimer > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(120, 255, 100, 0.15)';
      ctx.beginPath(); ctx.arc(this.x, this.y - 4, this.radius * 1.6, 0, TAU); ctx.fill();
      ctx.restore();
    }
    if (this.hp < this.maxHp || this.type === 'orc' || this.type === 'ogre' || this.type === 'dragon') {
      const w = this.radius * 2.4, h = 4;
      const x = this.x - w / 2, y = this.y - this.radius - 18;
      const p = clamp(this.hp / this.maxHp, 0, 1);
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(ctx, x - 1, y - 1, w + 2, h + 2, 2); ctx.fill();
      const c1 = p > 0.5 ? '#84f08a' : p > 0.25 ? '#ffe066' : '#ff8078';
      const c2 = p > 0.5 ? '#2f9f4a' : p > 0.25 ? '#c8961e' : '#a8241c';
      const grad = ctx.createLinearGradient(x, y, x + w, y);
      grad.addColorStop(0, c1); grad.addColorStop(1, c2);
      ctx.fillStyle = grad;
      roundRect(ctx, x, y, Math.max(0.001, w * p), h, 2); ctx.fill();
      ctx.restore();
    }
  }
  drawSprite(ctx) { this.drawGeneric(ctx); }
  drawGeneric(ctx) {
    ctx.save();
    ctx.fillStyle = 'rgba(6,22,10,0.3)';
    ctx.beginPath(); ctx.ellipse(this.x, this.y + 6, this.radius, this.radius * 0.4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#888';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function createEnemy(game, type, hpMul) {
  const def = ENEMY_DEFS[type];
  if (type === 'goblin') return new Goblin(game, def, hpMul);
  if (type === 'wolf') return new Wolf(game, def, hpMul);
  if (type === 'orc') return new Orc(game, def, hpMul);
  if (type === 'skeleton') return new Skeleton(game, def, hpMul);
  if (type === 'shaman') return new Shaman(game, def, hpMul);
  if (type === 'slime') return new Slime(game, def, hpMul);
  if (type === 'ogre') return new Ogre(game, def, hpMul);
  if (type === 'wraith') return new Wraith(game, def, hpMul);
  if (type === 'demon') return new Demon(game, def, hpMul);
  if (type === 'dark_knight') return new DarkKnight(game, def, hpMul);
  if (type === 'dragon') return new Dragon(game, def, hpMul);
  return new Enemy(game, def, hpMul);
}

/* ============================================================
   ALLIED UNITS
   ============================================================ */
class AllyUnit {
  constructor(game, camp, type, stats) {
    this.game = game; this.camp = camp; this.type = type;
    this.homeX = camp.x; this.homeY = camp.y + 10;
    this.x = this.homeX; this.y = this.homeY;
    this.maxHp = stats.allyHp; this.hp = this.maxHp;
    this.damage = stats.allyDamage; this.speed = stats.allySpeed;
    this.range = stats.allyRange;
    this.attackSpeed = stats.allyAttackSpeed;
    this.leashRange = stats.leashRange;
    this.radius = type === 'giant' ? 20 : 11;
    this.cooldown = 0; this.facing = 1;
    this.anim = Math.random() * 10;
    this.dead = false; this.hitFlash = 0;
    this.deathTimer = 0;
  }
  takeDamage(a) {
    if (this.dead) return;
    this.hp -= a;
    this.hitFlash = 0.12;
    if (this.hp <= 0) { this.hp = 0; this.dead = true; this.deathTimer = 0.4; }
  }
  update(dt) {
    if (this.dead) { this.deathTimer -= dt; return; }
    this.anim += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.cooldown > 0) this.cooldown -= dt;
    let target = null, bestD = Infinity;
    for (const e of this.game.enemies) {
      if (e.dead) continue;
      if (dist(this.camp.x, this.camp.y, e.x, e.y) > this.leashRange) continue;
      const d = dist(this.x, this.y, e.x, e.y);
      if (d < bestD) { bestD = d; target = e; }
    }
    if (target) {
      const d = dist(this.x, this.y, target.x, target.y);
      if (d > this.range + target.radius) {
        const a = Math.atan2(target.y - this.y, target.x - this.x);
        this.x += Math.cos(a) * this.speed * dt;
        this.y += Math.sin(a) * this.speed * dt;
        if (Math.abs(Math.cos(a)) > 0.2) this.facing = Math.cos(a) > 0 ? 1 : -1;
      } else if (this.cooldown <= 0) {
        target.takeDamage(this.damage);
        this.cooldown = this.attackSpeed;
      }
    } else {
      const d = dist(this.x, this.y, this.homeX, this.homeY);
      if (d > 8) {
        const a = Math.atan2(this.homeY - this.y, this.homeX - this.x);
        this.x += Math.cos(a) * this.speed * 0.7 * dt;
        this.y += Math.sin(a) * this.speed * 0.7 * dt;
        if (Math.abs(Math.cos(a)) > 0.2) this.facing = Math.cos(a) > 0 ? 1 : -1;
      }
    }
  }
  draw(ctx) {
    if (this.dead) return;
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.fillStyle = 'rgba(6,22,10,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 8, this.radius, this.radius * 0.4, 0, 0, TAU); ctx.fill();
    ctx.scale(this.facing, 1);
    if (this.type === 'soldier') {
      ctx.fillStyle = '#4a6fa8';
      ctx.beginPath(); ctx.ellipse(0, -2, 6, 7.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e8c39a';
      ctx.beginPath(); ctx.arc(0, -11, 4.2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8a9aa8';
      ctx.beginPath(); ctx.arc(0, -12, 4.8, Math.PI, TAU); ctx.fill();
      ctx.fillStyle = '#e8eef4';
      ctx.fillRect(5, -6, 2, 12);
    } else {
      const bg = ctx.createLinearGradient(-14, -10, 14, 10);
      bg.addColorStop(0, '#9a7a5a'); bg.addColorStop(1, '#3a2a1a');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, -2, 16, 14, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8a6a4a';
      ctx.beginPath(); ctx.arc(0, -22, 10, 0, TAU); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,180,60,0.95)';
      ctx.beginPath(); ctx.arc(-3.5, -24, 1.6, 0, TAU); ctx.arc(3.5, -24, 1.6, 0, TAU); ctx.fill();
      ctx.restore();
    }
    if (this.hitFlash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,255,255,${this.hitFlash * 4})`;
      ctx.beginPath(); ctx.ellipse(0, -4, this.radius, this.radius * 1.5, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
    if (this.hp < this.maxHp) {
      const w = this.radius * 2.2, h = 3.2;
      const x = this.x - w / 2, y = this.y - this.radius - 12;
      const p = clamp(this.hp / this.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(ctx, x - 1, y - 1, w + 2, h + 2, 2); ctx.fill();
      ctx.fillStyle = '#6ee0a8';
      roundRect(ctx, x, y, w * p, h, 2); ctx.fill();
    }
  }
}

/* ============================================================

   ============================================================ */
function drawTowerFamily(ctx, family, x, y, level, angle, time, recoil, v) {
  const c1 = v.c1, c2 = v.c2, acc = v.acc;
  ctx.save(); ctx.translate(x, y);

  // Shadow
  ctx.fillStyle = 'rgba(6,22,10,0.32)';
  ctx.beginPath(); ctx.ellipse(3, 8, 26, 11, 0, 0, TAU); ctx.fill();

  if (family === 'archer') {
    // Stone base + wooden tower
    const bg = ctx.createRadialGradient(-9, -2, 3, 0, 5, 30);
    bg.addColorStop(0, '#c8c2b1'); bg.addColorStop(0.6, '#a39c8c'); bg.addColorStop(1, '#6a6457');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 4, 25, 11.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6b4529';
    for (let i = 0; i < 3; i++) {
      const px = [-14, 0, 14][i];
      ctx.fillRect(px - 3, -30, 6, 36);
    }
    ctx.strokeStyle = '#4d3018'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-14, -20); ctx.lineTo(14, -8); ctx.moveTo(14, -20); ctx.lineTo(-14, -8); ctx.stroke();
    const pg = ctx.createLinearGradient(0, -38, 0, -24);
    pg.addColorStop(0, level >= 3 ? '#e0b878' : '#c99a5c'); pg.addColorStop(1, '#8a6238');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(0, -29, 20, 8, 0, 0, TAU); ctx.fill();
    // Archer
    ctx.save(); ctx.translate(0, -33);
    ctx.fillStyle = c1;
    ctx.beginPath(); ctx.ellipse(0, 1, 6, 7.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8c39a';
    ctx.beginPath(); ctx.arc(0, -8, 4.6, 0, TAU); ctx.fill();
    ctx.fillStyle = c2;
    ctx.beginPath(); ctx.arc(0, -9, 5.6, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
    ctx.save(); ctx.translate(0, -3); ctx.rotate(angle);
    ctx.strokeStyle = '#c9a05a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(9, 0, 8, -Math.PI / 2 - 0.2, Math.PI / 2 + 0.2); ctx.stroke();
    ctx.strokeStyle = acc; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(15, 0); ctx.stroke();
    ctx.restore();
    ctx.restore();
  } else if (family === 'artillery') {
    const bg = ctx.createLinearGradient(-25, 0, 25, 0);
    bg.addColorStop(0, c2); bg.addColorStop(0.3, c1); bg.addColorStop(0.7, c2); bg.addColorStop(1, '#0a0a0e');
    ctx.fillStyle = bg;
    roundRect(ctx, -22, -14, 44, 22, 4); ctx.fill();

    ctx.save(); ctx.translate(-recoil * 6, 0);

    roundRect(ctx, -3, -5, 30, 10, 3); ctx.fill();
    ctx.fillStyle = acc;
    roundRect(ctx, 25, -6, 6, 12, 2); ctx.fill();
    if (recoil > 0.4) {
      const gl = ctx.createRadialGradient(32, 0, 0, 32, 0, 14);
      gl.addColorStop(0, `rgba(${hexToRgb(acc)}, ${recoil})`);
      gl.addColorStop(1, `rgba(${hexToRgb(acc)}, 0)`);
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(32, 0, 14, 0, TAU); ctx.fill();
    }
    ctx.restore();
    const hg = ctx.createRadialGradient(-3, -3, 1, 0, 0, 12);
    hg.addColorStop(0, acc); hg.addColorStop(1, c2);
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (family === 'wizard') {
    const bg = ctx.createRadialGradient(-8, -1, 3, 0, 5, 30);
    bg.addColorStop(0, c1); bg.addColorStop(1, '#0a0614');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 4, 24, 11, 0, 0, TAU); ctx.fill();
    const sg = ctx.createLinearGradient(-15, 0, 15, 0);
    sg.addColorStop(0, c2); sg.addColorStop(0.35, c1); sg.addColorStop(0.7, c2); sg.addColorStop(1, '#0a0614');
