    ctx.beginPath();
    ctx.moveTo(-14, 3); ctx.quadraticCurveTo(-8, -24, 0, -46);
    ctx.quadraticCurveTo(8, -24, 14, 3); ctx.closePath(); ctx.fill();
    const pulse = 1 + Math.sin(time * 3) * 0.13;
    const orbX = Math.cos(angle) * 3.2, orbY = -58;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(orbX, orbY, 0, orbX, orbY, 28 * pulse);
    halo.addColorStop(0, `rgba(${hexToRgb(acc)}, 0.85)`);
    halo.addColorStop(1, `rgba(${hexToRgb(acc)}, 0)`);
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(orbX, orbY, 28 * pulse, 0, TAU); ctx.fill();
    ctx.restore();
    const og = ctx.createRadialGradient(orbX - 3, orbY - 4, 1, orbX, orbY, 9 * pulse);
    og.addColorStop(0, '#f6ecff'); og.addColorStop(0.5, acc); og.addColorStop(1, c2);
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(orbX, orbY, 8 * pulse, 0, TAU); ctx.fill();
  } else if (family === 'water') {
    // Water base with waves
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const wg = ctx.createRadialGradient(0, 5, 0, 0, 5, 30);
    wg.addColorStop(0, 'rgba(80, 180, 220, 0.6)');
    wg.addColorStop(1, 'rgba(80, 180, 220, 0)');
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.ellipse(0, 5, 30, 14, 0, 0, TAU); ctx.fill();
    ctx.restore();
    // Stone base
    const bg = ctx.createRadialGradient(-6, 0, 3, 0, 5, 26);
    bg.addColorStop(0, '#a8b0c0'); bg.addColorStop(1, '#4a5260');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 4, 22, 10, 0, 0, TAU); ctx.fill();
    // Crystal spire
    const sg = ctx.createLinearGradient(-10, -40, 10, 4);
    sg.addColorStop(0, c1); sg.addColorStop(0.5, c2); sg.addColorStop(1, '#0a1a2a');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(0, -40); ctx.lineTo(-10, 4); ctx.lineTo(10, 4); ctx.closePath(); ctx.fill();
    // Crystal shine
    ctx.strokeStyle = acc; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(-2, -36); ctx.lineTo(-2, 0); ctx.stroke();
    ctx.globalAlpha = 1;
    // Glowing gem
    const pulse = 1 + Math.sin(time * 3) * 0.15;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gl = ctx.createRadialGradient(0, -20, 0, 0, -20, 15 * pulse);
    gl.addColorStop(0, `rgba(${hexToRgb(acc)}, 0.9)`);
    gl.addColorStop(1, `rgba(${hexToRgb(acc)}, 0)`);
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, -20, 15 * pulse, 0, TAU); ctx.fill();
    ctx.restore();
    // Wave crest
    ctx.strokeStyle = acc; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-18, 6);
    ctx.quadraticCurveTo(-9, 2, 0, 6);
    ctx.quadraticCurveTo(9, 10, 18, 6);
    ctx.stroke();
  } else if (family === 'mountain') {
    // Rocky base
    const bg = ctx.createRadialGradient(-6, 0, 3, 0, 6, 28);
    bg.addColorStop(0, '#a89a8a'); bg.addColorStop(1, '#4a3f32');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 4, 24, 12, 0, 0, TAU); ctx.fill();
    // Rocky tower
    const rg = ctx.createLinearGradient(-14, -40, 14, 4);
    rg.addColorStop(0, c1); rg.addColorStop(0.5, c2); rg.addColorStop(1, '#1a1a10');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(-14, 4); ctx.lineTo(-8, -30); ctx.lineTo(0, -40);
    ctx.lineTo(8, -30); ctx.lineTo(14, 4);
    ctx.closePath(); ctx.fill();
    // Cracks
    ctx.strokeStyle = 'rgba(30,20,10,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-6, -20); ctx.lineTo(-2, -14); ctx.lineTo(2, -18); ctx.stroke();
    // Glowing rune
    const pulse = 1 + Math.sin(time * 3) * 0.15;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gl = ctx.createRadialGradient(0, -22, 0, 0, -22, 14 * pulse);
    gl.addColorStop(0, `rgba(${hexToRgb(acc)}, 0.9)`);
    gl.addColorStop(1, `rgba(${hexToRgb(acc)}, 0)`);
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, -22, 14 * pulse, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = acc;
    ctx.beginPath(); ctx.arc(0, -22, 3, 0, TAU); ctx.fill();
  } else if (family === 'camp') {
    // Camps are drawn separately with detail
    const bg = ctx.createRadialGradient(-8, 0, 3, 0, 5, 28);
    bg.addColorStop(0, '#b9b3a4'); bg.addColorStop(1, '#5b5649');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 4, 26, 11, 0, 0, TAU); ctx.fill();
    const wg = ctx.createLinearGradient(-22, -30, 22, 4);
    wg.addColorStop(0, c1); wg.addColorStop(0.6, c2); wg.addColorStop(1, '#1a1208');
    ctx.fillStyle = wg;
    roundRect(ctx, -22, -28, 44, 30, 4); ctx.fill();
    const rg = ctx.createLinearGradient(0, -50, 0, -28);
    rg.addColorStop(0, c1); rg.addColorStop(1, c2);
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.moveTo(-26, -28); ctx.lineTo(0, -48); ctx.lineTo(26, -28); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -48); ctx.lineTo(0, -72); ctx.stroke();
    const wave = Math.sin(time * 3) * 2.5;
    const fg = ctx.createLinearGradient(0, -70, 20, -62);
    fg.addColorStop(0, acc); fg.addColorStop(1, c2);
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(0, -70);
    ctx.quadraticCurveTo(11, -72 + wave, 20, -66);
    ctx.quadraticCurveTo(11, -62 - wave, 0, -60);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1a0e04';
    roundRect(ctx, -5, -8, 10, 12, 2); ctx.fill();
  } else if (family === 'support') {
    const bg = ctx.createRadialGradient(-6, 0, 3, 0, 5, 28);
    bg.addColorStop(0, '#b9b3a4'); bg.addColorStop(1, '#5b5649');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 4, 22, 10, 0, 0, TAU); ctx.fill();
    const pg = ctx.createLinearGradient(-8, 0, 8, 0);
    pg.addColorStop(0, c2); pg.addColorStop(0.5, c1); pg.addColorStop(1, c2);
    ctx.fillStyle = pg;
    roundRect(ctx, -8, -42, 16, 46, 3); ctx.fill();
    const pulse = 1 + Math.sin(time * 2.6) * 0.18;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gl = ctx.createRadialGradient(0, -50, 0, 0, -50, 22 * pulse);
    gl.addColorStop(0, `rgba(${hexToRgb(acc)}, 0.9)`);
    gl.addColorStop(1, `rgba(${hexToRgb(acc)}, 0)`);
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, -50, 22 * pulse, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = acc;
    ctx.beginPath(); ctx.arc(0, -50, 6 * pulse, 0, TAU); ctx.fill();
  }

  ctx.restore();
}

/* ============================================================
   TOWER
   ============================================================ */
class Tower {
  constructor(game, foundation, def) {
    this.game = game;
    this.def = def;
    this.foundation = foundation;
    this.x = foundation.x;
    this.y = foundation.y;
    this.level = 1;
    this.angle = -Math.PI / 2;
    this.cooldown = 0;
    this.recoil = 0;
    this.invested = def.cost;
    this.allies = [];
    this.spawnTimer = 2;
    this.goldTimer = 0;
    this.buffDamage = 0;
    this.buffRange = 0;
    this.buffSpeed = 0;
    this.auraTimer = 0;
  }
  get stats() { return this.def.levels[this.level - 1]; }
  get range() { return this.stats.range * (1 + this.buffRange); }
  upgradeCost() { return this.level >= 3 ? null : this.def.upgradeCost[this.level - 1]; }
  sellValue() { return Math.floor(this.invested * 0.7); }
  upgrade() {
    if (this.level >= 3) return;
    const cost = this.upgradeCost();
    if (this.game.gold < cost) return;
    this.game.gold -= cost;
    this.invested += cost;
    this.level++;
    this.game.addText('LVL ' + this.level, this.x, this.y - 60, '#8ef79a', 13);
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * TAU, s = 30 + Math.random() * 80;
      this.game.particles.push(new Particle({
        x: this.x, y: this.y - 18, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: 0.5, size: 2.2, color: '150, 255, 160', type: 'circle', drag: 0.93
      }));
    }
  }
  findTarget() {
    let best = null, bestD = -1;
    for (const e of this.game.enemies) {
      if (e.dead) continue;
      const d = dist(this.x, this.y, e.x, e.y);
      if (d <= this.range + e.radius && e.distance > bestD) { bestD = e.distance; best = e; }
    }
    return best;
  }
  update(dt) {
    if (this.cooldown > 0) this.cooldown -= dt;
    if (this.recoil > 0) this.recoil = Math.max(0, this.recoil - dt * 5.5);
    const b = this.def.behavior;
    if (b === 'camp') this.updateCamp(dt);
    else if (b === 'gold') this.updateGold(dt);
    else if (b === 'aura') this.updateAura(dt);
    else if (b === 'buffDamage' || b === 'buffSpeed' || b === 'buffRange') { /* handled in computeBuffs */ }
    else this.updateCombat(dt);
  }
  updateCamp(dt) {
    this.spawnTimer -= dt;
    this.allies = this.allies.filter(a => !a.dead);
    if (this.spawnTimer <= 0 && this.allies.length < this.stats.maxAllies) {
      const ally = new AllyUnit(this.game, this, this.def.allyType, this.stats);
      this.allies.push(ally);
      this.game.allies.push(ally);
      this.game.particles.push(new Particle({
        x: this.x, y: this.y, life: 0.4, size: 7, color: '140, 255, 160', type: 'ring', drag: 1
      }));
      this.spawnTimer = this.stats.spawnInterval;
    }
  }
  updateGold(dt) {
    this.goldTimer -= dt;
    if (this.goldTimer <= 0) {
      this.goldTimer = 4;
      const g = this.stats.goldPerTick || 5;
      this.game.gold += g;
      this.game.addText('+' + g, this.x, this.y - 40, '#ffd257', 11);
    }
  }
  updateAura(dt) {
    this.auraTimer -= dt;
    if (this.auraTimer <= 0) {
      this.auraTimer = 0.5;
      const dps = this.stats.auraDps || 10;
      for (const e of this.game.enemies) {
        if (e.dead) continue;
        if (dist(this.x, this.y, e.x, e.y) < this.range) {
          e.takeDamage(dps * 0.5);
          this.game.particles.push(new Particle({
            x: e.x + (Math.random() - 0.5) * 10, y: e.y - 6,
            vx: (Math.random() - 0.5) * 20, vy: -20,
            life: 0.35, size: 2, color: hexToRgb(this.def.visual.acc), type: 'circle', drag: 0.94
          }));
        }
      }
    }
  }
  updateCombat(dt) {
    const target = this.findTarget();
    if (target) {
      const desired = Math.atan2(target.y - this.y, target.x - this.x);
      this.angle = angleLerp(this.angle, desired, 1 - Math.pow(0.0006, dt));
      if (this.cooldown <= 0) {
        this.fire(target);
        this.cooldown = this.stats.cooldown * (1 - this.buffSpeed);
      }
    }
  }
  fire(target) {
    const b = this.def.behavior;
    const s = this.stats;
    const acc = this.def.visual.acc;
    const rgbAcc = hexToRgb(acc);
    const dmg = (s.damage || 0) * (1 + this.buffDamage);

    switch (b) {
      case 'arrow': {
        this.recoil = 1;
        this.game.projectiles.push(new ArrowProj(this.game,
          this.x + Math.cos(this.angle) * 6, this.y - 36 + Math.sin(this.angle) * 6,
          target, dmg, s.projectileSpeed || 500, rgbAcc));
        break;
      }
      case 'sniper': {
        this.game.effects.push(new Beam(this.x, this.y - 20, target.x, target.y - 6, rgbAcc, 5));
        target.takeDamage(dmg);
        this.game.particles.push(new Particle({
          x: this.x + Math.cos(this.angle) * 18, y: this.y - 20 + Math.sin(this.angle) * 18,
          life: 0.2, size: 7, color: rgbAcc, type: 'circle', drag: 1
        }));
        break;
      }
      case 'multishot': {
        for (let i = -1; i <= 1; i++) {
          const ang = this.angle + i * 0.25;
          const arrow = new ArrowProj(this.game,
            this.x + Math.cos(ang) * 6, this.y - 30 + Math.sin(ang) * 6,
            target, dmg, s.projectileSpeed || 500, rgbAcc);
          arrow.angle = ang;
          this.game.projectiles.push(arrow);
        }
        this.recoil = 1;
        break;
      }
      case 'boomerang': {
        this.game.projectiles.push(new BoomerangProj(this.game,
          this.x + Math.cos(this.angle) * 10, this.y - 20 + Math.sin(this.angle) * 10,
          target, dmg, s.projectileSpeed || 350, rgbAcc));
        break;
      }
      case 'poison': {
        this.game.projectiles.push(new ArrowProj(this.game,
          this.x + Math.cos(this.angle) * 6, this.y - 30 + Math.sin(this.angle) * 6,
          target, dmg, s.projectileSpeed || 500, '160,255,120',
          { dps: s.poisonDps || 8, duration: s.poisonDuration || 3 }));
        break;
      }
      case 'mine': {
        // Drop mine at target position
        const mx = target.x + (Math.random() - 0.5) * 20;
        const my = target.y + (Math.random() - 0.5) * 20;
        this.game.projectiles.push(new MineProj(this.game, mx, my, s.mineDamage || 40, s.mineSplash || 50, rgbAcc));
        break;
      }
      case 'chain': {
        const chainRange = s.chainRange || 90;
        const jumps = s.jumps || 3;
        const hit = new Set([target]);
        let current = target;
        const path = [target];
        for (let j = 0; j < jumps; j++) {
          let best = null, bd = chainRange;
          for (const e of this.game.enemies) {
            if (e.dead || hit.has(e)) continue;
            const d = dist(current.x, current.y, e.x, e.y);
            if (d < bd) { bd = d; best = e; }
          }
          if (!best) break;
          path.push(best); hit.add(best); current = best;
        }
        let fx = this.x, fy = this.y - 30;
        for (let i = 0; i < path.length; i++) {
          const e = path[i];
          this.game.effects.push(new Beam(fx, fy, e.x, e.y - 6, rgbAcc, 6));
          e.takeDamage(dmg * Math.pow(0.85, i));
          fx = e.x; fy = e.y - 6;
        }
        break;
      }
      case 'laser': {
        // Piercing line
        const startX = this.x, startY = this.y - 20;
        const dx = Math.cos(this.angle), dy = Math.sin(this.angle);
        let hitAny = false;
        for (const e of this.game.enemies) {
          if (e.dead) continue;
          // Distance from point to line
          const t = (e.x - startX) * dx + (e.y - startY) * dy;
          if (t < 0 || t > this.range) continue;
          const px = startX + dx * t, py = startY + dy * t;
          if (dist(px, py, e.x, e.y) < e.radius + 8) {
            e.takeDamage(dmg);
            hitAny = true;
          }
        }
        const endX = startX + dx * this.range;
        const endY = startY + dy * this.range;
        this.game.effects.push(new Beam(startX, startY, endX, endY, rgbAcc, 4));
        if (hitAny) this.game.shake = Math.max(this.game.shake, 2);
        break;
      }
      case 'volley': {
        for (let i = 0; i < 6; i++) {
          const ang = this.angle + (Math.random() - 0.5) * 0.5;
          const arrow = new ArrowProj(this.game,
            this.x + Math.cos(ang) * 6, this.y - 25 + Math.sin(ang) * 6,
            target, dmg, s.projectileSpeed || 500, rgbAcc);
          this.game.projectiles.push(arrow);
        }
        this.recoil = 1;
        break;
      }
      case 'splash': {
        this.recoil = 1;
        const tx = target.x + (target.vx || 0) * 0.28;
        const ty = target.y + (target.vy || 0) * 0.28;
        this.game.projectiles.push(new MortarProj(this.game,
          this.x + Math.cos(this.angle) * 20, this.y - 20 + Math.sin(this.angle) * 20,
          tx, ty, dmg, s.splash || 50, rgbAcc));
        break;
      }
      case 'boulder': {
        this.recoil = 1;
        const tx = target.x + (target.vx || 0) * 0.35;
        const ty = target.y + (target.vy || 0) * 0.35;
        this.game.projectiles.push(new MortarProj(this.game,
          this.x + Math.cos(this.angle) * 20, this.y - 20 + Math.sin(this.angle) * 20,
          tx, ty, dmg, s.splash || 60, rgbAcc));
        break;
      }
      case 'beam': {
        this.game.effects.push(new Beam(this.x, this.y - 58, target.x, target.y - 6, rgbAcc, 7));
        target.takeDamage(dmg);
        if (!target.dead && s.slow) target.applySlow(s.slow, s.slowDuration);
        break;
      }
      case 'tentacle': {
        this.game.effects.push(new Beam(this.x, this.y - 20, target.x, target.y - 6, rgbAcc, 5));
        target.takeDamage(dmg);
        break;
      }
      case 'icenova': {
        // AoE freeze at target
        const tx = target.x, ty = target.y;
        const splash = s.splash || 70;
        for (const e of this.game.enemies) {
          if (e.dead) continue;
          if (dist(tx, ty, e.x, e.y) < splash + e.radius) {
            e.takeDamage(dmg);
            if (!e.dead && s.slow) e.applySlow(s.slow, s.slowDuration);
          }
        }
        this.game.particles.push(new Particle({
          x: tx, y: ty, life: 0.5, size: 6, color: rgbAcc, type: 'ring', drag: 1
        }));
        for (let i = 0; i < 14; i++) {
          const a = Math.random() * TAU, sp = 60 + Math.random() * 100;
          this.game.particles.push(new Particle({
            x: tx, y: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.4, size: 2, color: rgbAcc, type: 'spark', drag: 0.94
          }));
        }
        break;
      }
      case 'flame': {
        // Cone of fire
        const coneAngle = 0.6;
        const coneRange = this.range;
        for (const e of this.game.enemies) {
          if (e.dead) continue;
          const a = Math.atan2(e.y - this.y, e.x - this.x);
          let diff = ((a - this.angle + Math.PI) % TAU + TAU) % TAU - Math.PI;
          if (Math.abs(diff) < coneAngle && dist(this.x, this.y, e.x, e.y) < coneRange) {
            e.takeDamage(dmg);
          }
        }
        for (let i = 0; i < 12; i++) {
          const a = this.angle + (Math.random() - 0.5) * coneAngle * 2;
          const sp = 150 + Math.random() * 200;
          this.game.particles.push(new Particle({
            x: this.x + Math.cos(this.angle) * 10, y: this.y - 20,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.3, size: 3, color: rgbAcc, type: 'circle', drag: 0.9
          }));
        }
        break;
      }
      case 'wave': {
        // Expanding wave AoE
        const tx = target.x, ty = target.y;
        const splash = s.splash || 60;
        for (const e of this.game.enemies) {
          if (e.dead) continue;
          if (dist(tx, ty, e.x, e.y) < splash + e.radius) e.takeDamage(dmg);
        }
        this.game.particles.push(new Particle({
          x: tx, y: ty, life: 0.4, size: 8, color: rgbAcc, type: 'ring', drag: 1
        }));
        break;
      }
      case 'knockback': {
        target.takeDamage(dmg);
        // Push back along path
        target.distance = Math.max(0, target.distance - 60);
        for (let i = 0; i < 8; i++) {
          const a = Math.random() * TAU, sp = 40 + Math.random() * 80;
          this.game.particles.push(new Particle({
            x: target.x, y: target.y - 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.3, size: 2, color: rgbAcc, type: 'spark', drag: 0.9
          }));
        }
        break;
      }
    }
  }
  draw(ctx, time) {
    drawTowerFamily(ctx, this.def.visual.family, this.x, this.y, this.level,
      this.angle, time + this.x * 0.01, this.recoil, this.def.visual);
  }
}

/* ============================================================
   FOUNDATION
   ============================================================ */
class Foundation {
  constructor(x, y, placement) {
    this.x = x; this.y = y; this.r = 22; this.tower = null; this.placement = placement;
  }
  draw(ctx, hovered) {
    ctx.save(); ctx.translate(this.x, this.y);
    const isWater = this.placement === 'water';
    const isMountain = this.placement === 'mountain';
    // Base color per placement
    if (isWater) {
      ctx.fillStyle = 'rgba(60,140,200,0.35)';
      ctx.beginPath(); ctx.ellipse(2, 4, 24, 10, 0, 0, TAU); ctx.fill();
    } else if (isMountain) {
      ctx.fillStyle = 'rgba(80,60,40,0.4)';
      ctx.beginPath(); ctx.ellipse(2, 4, 24, 10, 0, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(6,22,10,0.28)';
      ctx.beginPath(); ctx.ellipse(2, 5, 24, 10, 0, 0, TAU); ctx.fill();
    }
    // Ring
    const rg = ctx.createRadialGradient(-5, -3, 2, 0, 2, 24);
    if (isWater) {
      rg.addColorStop(0, '#a8d8f0'); rg.addColorStop(0.6, '#6a9ac0'); rg.addColorStop(1, '#2a4a6a');
    } else if (isMountain) {
      rg.addColorStop(0, '#c8b8a0'); rg.addColorStop(0.6, '#8a7a60'); rg.addColorStop(1, '#4a3a2a');
    } else {
      rg.addColorStop(0, '#b9b3a4'); rg.addColorStop(0.6, '#8e887a'); rg.addColorStop(1, '#5b5649');
    }
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(0, 2, 23, 10.5, 0, 0, TAU); ctx.fill();
    // Inner
    const ig = ctx.createRadialGradient(-3, -1, 1, 0, 2, 17);
    if (isWater) { ig.addColorStop(0, '#4a8ac0'); ig.addColorStop(1, '#1a3a5a'); }
    else if (isMountain) { ig.addColorStop(0, '#7a6a50'); ig.addColorStop(1, '#3a2a1a'); }
    else { ig.addColorStop(0, '#8d867a'); ig.addColorStop(1, '#585347'); }
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.ellipse(0, 2, 17, 7.5, 0, 0, TAU); ctx.fill();
    // Placement icon
    if (!this.tower) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.004);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const ic = isWater ? '120, 200, 255' : isMountain ? '220, 170, 90' : '150, 235, 160';
      ctx.strokeStyle = `rgba(${ic}, ${0.3 + pulse * 0.4})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 2, 13, 5.5, 0, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(${ic}, ${0.4 + pulse * 0.4})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-4, 2); ctx.lineTo(4, 2);
      ctx.moveTo(0, -1); ctx.lineTo(0, 5); ctx.stroke();
      ctx.restore();
    }
    if (hovered) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const ic = isWater ? '120, 200, 255' : isMountain ? '220, 170, 90' : '160, 255, 170';
      const g = ctx.createRadialGradient(0, 2, 2, 0, 2, 30);
      g.addColorStop(0, `rgba(${ic}, 0.3)`); g.addColorStop(1, `rgba(${ic}, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 2, 30, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
}

/* ============================================================
   GAME
   ============================================================ */
class Game {
  constructor() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.state = 'menu';
    this.mouse = { x: -999, y: -999 };
    this.time = 0;
    this.shake = 0;
    this.shakeX = 0; this.shakeY = 0;
    this.wallpaperCanvas = null;
    this.wallpaperTime = 0;
    this.buildWallpaper();
  }

  buildWallpaper() {
    // Simple parallax wallpaper canvas for menu
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    // Gradient sky
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#2a4a6a');
    sky.addColorStop(0.4, '#5a8a6a');
    sky.addColorStop(0.7, '#3a6a3a');
    sky.addColorStop(1, '#1a3a24');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);
    // Distant hills
    g.fillStyle = 'rgba(60,90,60,0.6)';
    g.beginPath();
    g.moveTo(0, H * 0.55);
    for (let x = 0; x <= W; x += 50) {
      g.lineTo(x, H * 0.55 + Math.sin(x * 0.01) * 40 + Math.cos(x * 0.02) * 20);
    }
    g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
    // Grass
    const grassGrad = g.createLinearGradient(0, H * 0.65, 0, H);
    grassGrad.addColorStop(0, '#4a8a4a');
    grassGrad.addColorStop(1, '#1a3a24');
    g.fillStyle = grassGrad;
    g.fillRect(0, H * 0.65, W, H * 0.35);
    // Trees
    const rnd = mulberry32(42);
    for (let i = 0; i < 40; i++) {
      const x = rnd() * W;
      const y = H * 0.62 + rnd() * H * 0.35;
      const scale = 0.4 + rnd() * 0.5;
      drawPineTree(g, x, y, scale, rnd);
    }
    this.wallpaperCanvas = cv;
  }

  renderWallpaper() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(this.wallpaperCanvas, 0, 0);
    // Floating particles
    const t = this.wallpaperTime;
    for (let i = 0; i < 30; i++) {
      const seed = i * 137;
      const px = (W * 0.5 + Math.sin(t * 0.3 + seed) * 400 + seed * 13) % W;
      const py = (H * 0.3 + Math.cos(t * 0.5 + seed) * 200 + seed * 7) % (H * 0.7);
      const alpha = 0.2 + Math.sin(t + seed) * 0.15;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(px, py, 0, px, py, 20);
      g.addColorStop(0, `rgba(180, 255, 180, ${alpha})`);
      g.addColorStop(1, 'rgba(180, 255, 180, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, 20, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // Fireflies near bottom
    for (let i = 0; i < 15; i++) {
      const seed = i * 71;
      const px = (Math.sin(t * 0.2 + seed) * 400 + 500 + seed * 3) % W;
      const py = H * 0.7 + Math.sin(t * 0.4 + seed * 2) * 60 + (seed % 40);
      const alpha = 0.3 + Math.sin(t * 2 + seed) * 0.3;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(px, py, 0, px, py, 8);
      g.addColorStop(0, `rgba(255, 230, 100, ${alpha})`);
      g.addColorStop(1, 'rgba(255, 230, 100, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, 8, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  startLevel(N) {
    this.levelNum = N;
    const level = generateLevel(N);
    this.level = level;
    this.background = buildLevelBackground(level);
    this.path = new PathManager(level.waypoints);
    this.foundations = level.foundations.map(f => new Foundation(f.x, f.y, f.placement));
    this.towers = [];
    this.enemies = [];
    this.allies = [];
    this.projectiles = [];
    this.particles = [];
    this.texts = [];
    this.effects = [];
    // Every level starts with a generous setup budget.
    this.gold = 750 + N * 10;
    this.lives = 3;
    this.kills = 0;
    this.goldEarned = 0;
    this.state = 'game';
    this.buildDef = null;
    this.selectedTower = null;
    this.hoverFoundation = null;
    this.hpMul = level.wave.hpMul;
    this.spawnQueue = [];
    for (const grp of level.wave.groups) {
      for (let i = 0; i < grp.count; i++) {
        this.spawnQueue.push({ type: grp.type, time: grp.delay + i * grp.gap });
      }
    }
    this.spawnQueue.sort((a, b) => a.time - b.time);
    this.spawnIndex = 0;
    this.waveTimer = 0;
    // Give the player a setup phase: no enemy is created until Start Wave is pressed.
    this.waveActive = false;
    this.activeTab = 'archer';
    document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.cat === 'archer'));
    this.finished = false;

    // Reveal HUD
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('hint').classList.remove('hidden');
    document.getElementById('buildBar').classList.add('hidden');
    this.showShopHome();
    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('levelScreen').classList.add('hidden');
    document.getElementById('scoreScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    const startWaveBtn = document.getElementById('startWaveBtn');
    startWaveBtn.disabled = false;
    startWaveBtn.textContent = '▶ START WAVE';
    document.getElementById('shopBtn').textContent = '🏪 SHOP';
    this.rebuildStrip();
    this.syncHUD();
    this.addText('BUILD YOUR DEFENSES', W / 2, 150, '#9fe0ff', 28);
  }

  toggleShop() {
    if (this.state !== 'game') return;
    const shop = document.getElementById('buildBar');
    const opening = shop.classList.contains('hidden');
    shop.classList.toggle('hidden', !opening);
    document.getElementById('shopBtn').textContent = opening ? '✕ CLOSE SHOP' : '🏪 SHOP';
    if (opening) {
      this.showShopHome();
    }
  }

  showShopHome() {
    document.getElementById('shopTitle').textContent = 'SHOP';
    document.getElementById('shopSubtitle').textContent = 'CHOOSE WHAT YOU NEED';
    document.getElementById('shopHome').classList.remove('hidden');
    document.getElementById('towerBrowser').classList.add('hidden');
  }

  showTowerBrowser() {
    document.getElementById('shopTitle').textContent = 'BUY TOWERS';
    document.getElementById('shopSubtitle').textContent = 'SELECT A TOWER TO PLACE IT';
    document.getElementById('shopHome').classList.add('hidden');
    document.getElementById('towerBrowser').classList.remove('hidden');
    this.rebuildStrip();
    this.updateShopSelection();
  }

  closeShop() {
    document.getElementById('buildBar').classList.add('hidden');
    document.getElementById('shopBtn').textContent = '🏪 SHOP';
    this.showShopHome();
  }

  startWave() {
    if (this.state !== 'game' || this.waveActive || this.finished) return;
    this.waveActive = true;
    this.waveTimer = 0;
    document.getElementById('startWaveBtn').disabled = true;
    document.getElementById('startWaveBtn').textContent = 'WAVE ACTIVE';
    this.addText('WAVE ' + this.levelNum + ' STARTED', W / 2, 150, '#ffd257', 25);
  }

  update(dt) {
    this.time += dt;
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 22);
      this.shakeX = (Math.random() - 0.5) * this.shake * 2;
      this.shakeY = (Math.random() - 0.5) * this.shake * 2;
    } else { this.shakeX = 0; this.shakeY = 0; }

    if (this.state !== 'game') return;

    // Spawn
    if (this.waveActive) {
      this.waveTimer += dt;
      while (this.spawnIndex < this.spawnQueue.length &&
             this.spawnQueue[this.spawnIndex].time <= this.waveTimer) {
        const s = this.spawnQueue[this.spawnIndex];
        this.spawnIndex++;
        this.enemies.push(createEnemy(this, s.type, this.hpMul));
      }
    }

    // Enemies
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.update(dt);
      if (e.escaped) {
        this.lives--;
        this.shake = Math.max(this.shake, 12);
        this.addText('-1', e.x, e.y - 24, '#ff5f6d', 18);
        const livesEl = document.getElementById('lives');
        livesEl.classList.remove('flash');
        void livesEl.offsetWidth;
        livesEl.classList.add('flash');
        this.syncHUD();
        if (this.lives <= 0) { this.lives = 0; this.gameOver(); return; }
      }
      if (e.dead) this.enemies.splice(i, 1);
    }

    // Allies
    for (let i = this.allies.length - 1; i >= 0; i--) {
      const a = this.allies[i];
      a.update(dt);
      if (a.dead && a.deathTimer <= 0) this.allies.splice(i, 1);
    }

    // Buffs
    this.computeBuffs();
    for (const t of this.towers) t.update(dt);

    // Projectiles
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      this.projectiles[i].update(dt);
      if (this.projectiles[i].dead) this.projectiles.splice(i, 1);
    }
    // Effects
    for (let i = this.effects.length - 1; i >= 0; i--) {
      this.effects[i].update(dt);
      if (this.effects[i].dead) this.effects.splice(i, 1);
    }
    // Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update(dt);
      if (this.particles[i].dead) this.particles.splice(i, 1);
    }
    // Texts
    for (let i = this.texts.length - 1; i >= 0; i--) {
      this.texts[i].update(dt);
      if (this.texts[i].dead) this.texts.splice(i, 1);
    }

    // Check victory
    if (this.waveActive && this.spawnIndex >= this.spawnQueue.length && this.enemies.length === 0 && !this.finished) {
      this.finished = true;
      this.waveActive = false;
      this.victory();
    }
  }

  computeBuffs() {
    for (const t of this.towers) { t.buffDamage = 0; t.buffRange = 0; t.buffSpeed = 0; }
    for (const aura of this.towers) {
      const b = aura.def.behavior;
      if (b !== 'buffDamage' && b !== 'buffSpeed' && b !== 'buffRange') continue;
      const s = aura.stats;
      for (const t of this.towers) {
        if (t === aura) continue;
        if (dist(aura.x, aura.y, t.x, t.y) < s.range) {
          if (s.buffDamage) t.buffDamage += s.buffDamage;
          if (s.buffSpeed) t.buffSpeed += s.buffSpeed;
          if (s.buffRange) t.buffRange += s.buffRange;
        }
      }
    }
  }

  victory() {
    const score = this.kills * 10 + this.goldEarned + this.lives * 100;
    // Save progress
    saveProgress(this.levelNum, score);
    this.state = 'victory';
    document.getElementById('overTitle').textContent = 'VICTORY';
    document.getElementById('overTitle').style.color = '#8ef79a';
    document.getElementById('overSub').textContent = 'Level ' + this.levelNum + ' cleared!';
    document.getElementById('overStats').innerHTML =
      `<div class="os"><b>${this.kills}</b><span>Kills</span></div>
       <div class="os"><b>${this.lives}</b><span>Lives</span></div>
       <div class="os"><b>${score}</b><span>Score</span></div>`;
    document.getElementById('btnRetry').textContent = this.levelNum < TOTAL_LEVELS ? '▶ NEXT LEVEL' : '🏆 CAMPAIGN COMPLETE';
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('buildBar').classList.add('hidden');
  }

  gameOver() {
    const score = this.kills * 10 + this.goldEarned;
    saveScore(this.levelNum, score);
    this.state = 'gameover';
    document.getElementById('overTitle').textContent = 'DEFEAT';
    document.getElementById('overTitle').style.color = '#ff6b78';
    document.getElementById('overSub').textContent = 'Level ' + this.levelNum + ' failed.';
    document.getElementById('overStats').innerHTML =
      `<div class="os"><b>${this.kills}</b><span>Kills</span></div>
       <div class="os"><b>${this.lives}</b><span>Lives</span></div>
       <div class="os"><b>${score}</b><span>Score</span></div>`;
    document.getElementById('btnRetry').textContent = '⟳ RETRY LEVEL';
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('buildBar').classList.add('hidden');
  }

  addText(text, x, y, color, size) {
    this.texts.push(new FloatText(text, x, y, color, size));
  }

  syncHUD() {
    document.getElementById('lives').textContent = this.lives;
    document.getElementById('gold').textContent = this.gold;
    document.getElementById('waveNum').textContent = this.levelNum;
    document.querySelectorAll('.tcard').forEach(card => {
      const id = card.dataset.id;
      const def = TOWERS.find(t => t.id === id);
      if (def) card.classList.toggle('poor', this.gold < def.cost);
    });
  }

  buildTower(foundation, defId) {
    if (foundation.tower) return;
    const def = TOWERS.find(t => t.id === defId);
    if (!def) return;
    // Check placement
    if (def.placement !== 'land' && def.placement !== foundation.placement) {
      this.addText('WRONG TERRAIN', foundation.x, foundation.y - 40, '#ff7a7a', 12);
      return;
    }
    if (this.gold < def.cost) {
      this.addText('NEED GOLD', foundation.x, foundation.y - 40, '#ff7a7a', 12);
      return;
    }
    this.gold -= def.cost;
    const tower = new Tower(this, foundation, def);
    foundation.tower = tower;
    this.towers.push(tower);
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * 100;
      this.particles.push(new Particle({
        x: foundation.x + Math.cos(a) * 12, y: foundation.y + Math.sin(a) * 5,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5 - 25,
        life: 0.5, size: 3 + Math.random() * 3,
        color: '190, 180, 160', type: 'smoke', drag: 0.9, growth: 8
      }));
    }
    this.particles.push(new Particle({
      x: foundation.x, y: foundation.y, life: 0.4, size: 8, color: '170, 255, 180', type: 'ring', drag: 1
    }));
    this.syncHUD();
  }

  sellTower(tower) {
    const refund = tower.sellValue();
    this.gold += refund;
    this.addText('+' + refund, tower.x, tower.y - 40, '#ffd257', 14);
    tower.foundation.tower = null;
    for (const a of tower.allies) { a.dead = true; a.deathTimer = 0; }
    tower.allies = [];
    const idx = this.towers.indexOf(tower);
    if (idx >= 0) this.towers.splice(idx, 1);
    if (this.selectedTower === tower) this.selectedTower = null;
    this.syncHUD();
  }

  rebuildStrip() {
    const strip = document.getElementById('towerStrip');
    strip.innerHTML = '';
    const list = TOWERS.filter(t => t.category === this.activeTab);
    for (const def of list) {
      const card = document.createElement('div');
      card.className = 'tcard';
      card.dataset.id = def.id;
      if (this.gold < def.cost) card.classList.add('poor');
      const cv = document.createElement('canvas');
      cv.width = 252; cv.height = 196;
      card.appendChild(cv);
      const nm = document.createElement('div');
      nm.className = 'tn'; nm.textContent = def.name;
      card.appendChild(nm);
      const cc = document.createElement('div');
      cc.className = 'tc'; cc.textContent = def.cost;
      card.appendChild(cc);
      const plc = document.createElement('div');
      plc.className = 'plc ' + (def.placement === 'water' ? 'water' : def.placement === 'mountain' ? 'mountain' : '');
      plc.textContent = def.placement === 'water' ? '💧WATER' : def.placement === 'mountain' ? '⛰MOUNT' : 'GRASS';
      card.appendChild(plc);
      strip.appendChild(card);

      const c = cv.getContext('2d');
      c.clearRect(0, 0, 252, 196);
      c.save(); c.translate(126, 164);
      c.scale(1, 1);
      drawTowerFamily(c, def.visual.family, 0, 0, 1, -Math.PI / 2, 0, 0, def.visual);
      c.restore();

      card.addEventListener('click', () => {
        if (this.buildDef === def) { this.buildDef = null; }
        else { this.buildDef = def; this.selectedTower = null; }
        this.updateShopSelection();
        if (this.buildDef) this.closeShop();
      });
    }
  }

  updateShopSelection() {
    document.querySelectorAll('.tcard').forEach(card => {
      card.classList.toggle('selected', this.buildDef && card.dataset.id === this.buildDef.id);
    });
  }

  render() {
    const ctx = this.ctx;
    if (this.state === 'menu' || this.state === 'levelSelect' || this.state === 'highscore') {
      this.renderWallpaper();
      return;
    }
    if (this.state === 'victory' || this.state === 'gameover') {
      // still render background
    }
    ctx.clearRect(0, 0, W, H);
    if (this.background) ctx.drawImage(this.background, 0, 0);

    ctx.save();
    ctx.translate(this.shakeX, this.shakeY);

    // Foundations
    for (const f of this.foundations) {
      const isHover = f === this.hoverFoundation && !f.tower;
      f.draw(ctx, isHover);
    }

    // Selected range
    if (this.selectedTower) {
      const t = this.selectedTower;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const rg = ctx.createRadialGradient(t.x, t.y, t.range * 0.6, t.x, t.y, t.range);
      rg.addColorStop(0, 'rgba(120,220,255,0.05)'); rg.addColorStop(1, 'rgba(120,220,255,0.16)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(160,235,255,0.75)'; ctx.lineWidth = 2;
      ctx.setLineDash([9, 7]); ctx.lineDashOffset = -this.time * 26;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, TAU); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }

    // Build ghost
    if (this.buildDef && this.hoverFoundation && !this.hoverFoundation.tower) {
      const f = this.hoverFoundation;
      const def = this.buildDef;
      const correctTerrain = def.placement === 'land' || def.placement === f.placement;
      const canAfford = this.gold >= def.cost && correctTerrain;
      const r0 = def.levels[0].range;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const rg = ctx.createRadialGradient(f.x, f.y, r0 * 0.5, f.x, f.y, r0);
      rg.addColorStop(0, canAfford ? 'rgba(120,255,150,0.08)' : 'rgba(255,100,100,0.08)');
      rg.addColorStop(1, canAfford ? 'rgba(120,255,150,0.20)' : 'rgba(255,100,100,0.20)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(f.x, f.y, r0, 0, TAU); ctx.fill();
      ctx.strokeStyle = canAfford ? 'rgba(150,255,170,0.7)' : 'rgba(255,120,120,0.7)';
      ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(f.x, f.y, r0, 0, TAU); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      ctx.save(); ctx.globalAlpha = 0.5;
      drawTowerFamily(ctx, def.visual.family, f.x, f.y, 1, -Math.PI / 2, this.time, 0, def.visual);
      ctx.restore();
    }

    // Depth sorted entities
    const drawables = [];
    for (const t of this.towers) drawables.push({ y: t.y, kind: 'tower', ref: t });
    for (const e of this.enemies) drawables.push({ y: e.y, kind: 'enemy', ref: e });
    for (const a of this.allies) if (!a.dead) drawables.push({ y: a.y, kind: 'ally', ref: a });
    drawables.sort((a, b) => a.y - b.y);
    for (const d of drawables) {
      if (d.kind === 'tower') d.ref.draw(ctx, this.time);
      else d.ref.draw(ctx);
    }

    // Projectiles, effects, particles, texts
    for (const p of this.projectiles) p.draw(ctx);
    for (const e of this.effects) e.draw(ctx);
    for (const p of this.particles) p.draw(ctx);
    for (const t of this.texts) t.draw(ctx);

    // UI layer
    this.uiHits = [];
    this.renderUI(ctx);

    ctx.restore();
  }

  renderUI(ctx) {
    if (this.selectedTower) {
      const t = this.selectedTower;
      const bw = 96, bh = 32, gap = 8;
      const px = t.x - bw - gap / 2;
      const py = t.y - 118;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = "900 11px 'Trebuchet MS', sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.strokeText(t.def.name.toUpperCase() + ' L' + t.level, t.x, py - 14);
      ctx.fillStyle = '#d8f0d8';
      ctx.fillText(t.def.name.toUpperCase() + ' L' + t.level, t.x, py - 14);
      ctx.restore();

      const upCost = t.upgradeCost();
      const canUp = upCost !== null && this.gold >= upCost;
      ctx.save();
      const upGrad = ctx.createLinearGradient(0, py, 0, py + bh);
      if (upCost === null) { upGrad.addColorStop(0, 'rgba(70,80,70,0.92)'); upGrad.addColorStop(1, 'rgba(40,46,40,0.95)'); }
      else if (canUp) { upGrad.addColorStop(0, 'rgba(72,160,92,0.95)'); upGrad.addColorStop(1, 'rgba(28,92,46,0.98)'); }
      else { upGrad.addColorStop(0, 'rgba(120,90,70,0.92)'); upGrad.addColorStop(1, 'rgba(70,48,36,0.95)'); }
      ctx.fillStyle = upGrad;
      roundRect(ctx, px, py, bw, bh, 8); ctx.fill();
      ctx.strokeStyle = upCost === null ? 'rgba(120,130,120,0.5)' : canUp ? 'rgba(170,255,185,0.85)' : 'rgba(190,140,110,0.6)';
      ctx.lineWidth = 1.6;
      roundRect(ctx, px, py, bw, bh, 8); ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = "900 11px 'Trebuchet MS', sans-serif";
      ctx.fillStyle = '#eafaea';
      if (upCost === null) ctx.fillText('MAX', px + bw / 2, py + bh / 2);
      else {
        ctx.fillText('UPGRADE', px + bw / 2, py + bh / 2 - 5);
        ctx.font = "900 10px 'Trebuchet MS', sans-serif";
        ctx.fillStyle = canUp ? '#ffe08a' : '#ff9a9a';
        ctx.fillText('◉ ' + upCost, px + bw / 2, py + bh / 2 + 7);
      }
      ctx.restore();
      if (upCost !== null) this.uiHits.push({ kind: 'rect', x: px, y: py, w: bw, h: bh, action: () => { if (canUp) t.upgrade(); } });

      const sx = px + bw + gap;
      const sv = t.sellValue();
      ctx.save();
      const sg = ctx.createLinearGradient(0, py, 0, py + bh);
      sg.addColorStop(0, 'rgba(160,88,66,0.95)'); sg.addColorStop(1, 'rgba(88,40,28,0.98)');
      ctx.fillStyle = sg;
      roundRect(ctx, sx, py, bw, bh, 8); ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,150,0.75)'; ctx.lineWidth = 1.6;
      roundRect(ctx, sx, py, bw, bh, 8); ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = "900 11px 'Trebuchet MS', sans-serif";
      ctx.fillStyle = '#ffe9e0';
      ctx.fillText('SELL', sx + bw / 2, py + bh / 2 - 5);
      ctx.font = "900 10px 'Trebuchet MS', sans-serif";
      ctx.fillStyle = '#ffd257';
      ctx.fillText('◉ ' + sv, sx + bw / 2, py + bh / 2 + 7);
      ctx.restore();
      this.uiHits.push({ kind: 'rect', x: sx, y: py, w: bw, h: bh, action: () => this.sellTower(t) });
    }
  }

  handleClick(mx, my) {
    if (this.state !== 'game') return;
    for (const h of this.uiHits) {
      if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
        h.action(); return;
      }
    }
    for (const f of this.foundations) {
      const limit = f.tower ? f.r + 16 : f.r + 12;
      if (dist(mx, my, f.x, f.y) < limit) {
        if (f.tower) {
          this.selectedTower = this.selectedTower === f.tower ? null : f.tower;
          this.buildDef = null;
        } else if (this.buildDef) {
          this.buildTower(f, this.buildDef.id);
        }
        this.updateShopSelection();
        return;
      }
    }
    this.selectedTower = null;
  }

  updateHover() {
    const m = this.mouse;
    let hover = null;
    for (const f of this.foundations) {
      const limit = (f.tower || this.buildDef) ? f.r + 12 : 70;
      if (dist(m.x, m.y, f.x, f.y) < limit) { hover = f; break; }
    }
    this.hoverFoundation = hover;
    if (this.selectedTower && !this.selectedTower.foundation.tower) this.selectedTower = null;
  }
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem('vs_progress') || '{"currentLevel":1,"completed":[],"scores":[]}');
  } catch (e) {
    return { currentLevel: 1, completed: [], scores: [] };
  }
}
function saveProgress(levelN, score) {
  const p = loadProgress();
  if (!p.completed.includes(levelN)) p.completed.push(levelN);
  p.currentLevel = Math.max(p.currentLevel, Math.min(TOTAL_LEVELS, levelN + 1));
  p.scores.push({ level: levelN, score, date: new Date().toISOString(), victory: true });
  try { localStorage.setItem('vs_progress', JSON.stringify(p)); } catch (e) {}
}
function saveScore(levelN, score) {
  const p = loadProgress();
  p.scores.push({ level: levelN, score, date: new Date().toISOString(), victory: false });
  try { localStorage.setItem('vs_progress', JSON.stringify(p)); } catch (e) {}
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
const game = new Game();

// Build tabs
const TABS = [
  { id: 'archer', label: 'ARCHER' },
  { id: 'artillery', label: 'CANNON' },
  { id: 'wizard', label: 'MAGIC' },
  { id: 'water', label: 'WATER' },
  { id: 'mountain', label: 'MOUNT' },
  { id: 'camp', label: 'CAMP' },
  { id: 'support', label: 'SUPPORT' }
];
const tabsEl = document.getElementById('tabs');
TABS.forEach(t => {
  const b = document.createElement('button');
  b.className = 'tab' + (t.id === 'archer' ? ' active' : '');
  b.textContent = t.label;
  b.dataset.cat = t.id;
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    game.activeTab = t.id;
    game.rebuildStrip();
    game.updateShopSelection();
  });
  tabsEl.appendChild(b);
});

// Screen buttons
document.getElementById('btnCampaign').addEventListener('click', () => {
  const p = loadProgress();
  const startLvl = Math.max(1, Math.min(TOTAL_LEVELS, p.currentLevel));
  game.startLevel(startLvl);
});

document.getElementById('btnLevels').addEventListener('click', () => {
  buildLevelGrid();
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('levelScreen').classList.remove('hidden');
  game.state = 'levelSelect';
});

document.getElementById('btnScores').addEventListener('click', () => {
  buildScoreList();
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('scoreScreen').classList.remove('hidden');
  game.state = 'highscore';
});

document.getElementById('btnLevelBack').addEventListener('click', () => {
  document.getElementById('levelScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  game.state = 'menu';
});

document.getElementById('btnScoreBack').addEventListener('click', () => {
  document.getElementById('scoreScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  game.state = 'menu';
});

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('hint').classList.add('hidden');
  document.getElementById('buildBar').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  game.state = 'menu';
});

document.getElementById('startWaveBtn').addEventListener('click', () => {
  game.startWave();
});

document.getElementById('shopBtn').addEventListener('click', () => {
  game.toggleShop();
});

document.getElementById('buyTowersBtn').addEventListener('click', () => {
  game.showTowerBrowser();
});

document.getElementById('towerBackBtn').addEventListener('click', () => {
  game.showShopHome();
});

document.getElementById('btnRetry').addEventListener('click', () => {
  if (game.state === 'victory') {
    const next = game.levelNum + 1;
    if (next <= TOTAL_LEVELS) game.startLevel(next);
    else {
      // Campaign complete - back to menu
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('menuScreen').classList.remove('hidden');
      game.state = 'menu';
    }
  } else {
    game.startLevel(game.levelNum);
  }
});

document.getElementById('btnOverMenu').addEventListener('click', () => {
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  game.state = 'menu';
});

function buildLevelGrid() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  const p = loadProgress();
  for (let i = 1; i <= TOTAL_LEVELS; i++) {
    const b = document.createElement('button');
    b.className = 'lvlBtn';
    b.textContent = i;
    const done = p.completed.includes(i);
    if (done) b.classList.add('completed');
    else if (i === p.currentLevel) b.classList.add('current');
    else if (i > p.currentLevel && !done) b.classList.add('locked');
    if (done || i === p.currentLevel) {
      b.addEventListener('click', () => {
        document.getElementById('levelScreen').classList.add('hidden');
        game.startLevel(i);
      });
    }
    grid.appendChild(b);
  }
}

function buildScoreList() {
  const list = document.getElementById('scoreList');
  list.innerHTML = '';
  const p = loadProgress();
  const scores = p.scores.slice().reverse();
  if (scores.length === 0) {
    list.innerHTML = '<div class="emptyMsg">No scores yet. Play a level to see your highscores here!</div>';
    return;
  }
  for (const s of scores.slice(0, 50)) {
    const el = document.createElement('div');
    el.className = 'scoreItem';
    const date = new Date(s.date);
    const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString().slice(0, 5);
    const victoryLabel = s.victory ? '✓' : '✗';
    el.innerHTML = `
      <div class="siLevel">Lv ${s.level} ${victoryLabel}</div>
      <div class="siScore">${s.score} pts</div>
      <div class="siDate">${dateStr}</div>
      <button class="siRetry">RETRY</button>
    `;
    el.querySelector('.siRetry').addEventListener('click', () => {
      document.getElementById('scoreScreen').classList.add('hidden');
      game.startLevel(s.level);
    });
    list.appendChild(el);
  }
}

// Canvas mouse/touch
function getMouse(e) {
  const rect = game.canvas.getBoundingClientRect();
  const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  return {
    x: (cx - rect.left) * (W / rect.width),
    y: (cy - rect.top) * (H / rect.height)
  };
}

game.canvas.addEventListener('mousemove', e => {
  const m = getMouse(e);
  game.mouse.x = m.x; game.mouse.y = m.y;
  if (game.state === 'game') game.updateHover();
});
game.canvas.addEventListener('mouseleave', () => {
  game.mouse.x = -999; game.mouse.y = -999;
  game.hoverFoundation = null;
});
game.canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  const m = getMouse(e);
  game.mouse.x = m.x; game.mouse.y = m.y;
  game.updateHover();
  game.handleClick(m.x, m.y);
});
game.canvas.addEventListener('contextmenu', e => e.preventDefault());

game.canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 0) return;
  e.preventDefault();
  const m = getMouse(e.touches[0]);
  game.mouse.x = m.x; game.mouse.y = m.y;
  if (game.state === 'game') game.updateHover();
  game.handleClick(m.x, m.y);
}, { passive: false });

game.canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 0) return;
  const m = getMouse(e.touches[0]);
  game.mouse.x = m.x; game.mouse.y = m.y;
}, { passive: true });

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    game.buildDef = null;
    game.selectedTower = null;
    game.updateShopSelection();
  }
});

// Resize canvas
function resizeCanvas() {
  const wrap = document.getElementById('wrap');
  const r = wrap.getBoundingClientRect();
  game.canvas.width = 1000;
  game.canvas.height = 640;
}
window.addEventListener('resize', resizeCanvas);

// Main loop
let lastTime = performance.now();
function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (game.state === 'game' || game.state === 'victory' || game.state === 'gameover') {
    game.update(dt);
    game.render();
  } else {
    game.wallpaperTime += dt;
    game.renderWallpaper();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
